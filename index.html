<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Realisasi Anggaran Investasi - BNI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- SheetJS (XLSX) untuk Export & Import Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- jsPDF & AutoTable untuk Export PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bni: {
              teal: '#006666',
              'teal-dark': '#004d4d',
              'teal-subtle': '#EAF4F4',
              orange: '#F15A24',
              'orange-dark': '#D14817',
              'orange-subtle': '#FFF2EE',
              bg: '#F3F5F9'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F3F5F9; color: #1E293B; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: max-content;
      animation: marquee 85s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="antialiased selection:bg-bni-teal selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxf89NXCAtrjZn3bFdhtO45DfikiDn8SiYavFBDerqyzIBeUt8yiKAxXoSwOu24N9z-mA/exec";
    const PROGNOSA_API_URL = "https://script.google.com/macros/s/AKfycbz4TWK_hRVdz-Dsdpy0RGko2-rQFuqG6aA25UUJlcOxN7uXlGCFrWdgIOttVun5LxLk/exec";
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];

    const getEfsValue = (row, month) => {
      if (!row) return 0;
      const mKey = month.toLowerCase();
      if (row[`efs_${mKey}`] !== undefined && row[`efs_${mKey}`] !== null) {
        return Number(row[`efs_${mKey}`]) || 0;
      }
      return 0;
    };

    const getCumulativeRealisasiValue = (row, month) => {
      if (!row) return 0;
      const mKey = month.toLowerCase();
      if (row[mKey] !== undefined && row[mKey] !== null) {
        return Number(row[mKey]) || 0;
      }
      return Number(row.realisasi) || 0;
    };

    const formatIDR = (val) => {
      if (val === undefined || val === null || isNaN(val)) return 'Rp 0,00';
      return new Intl.NumberFormat('id-ID', { 
        style: 'currency', 
        currency: 'IDR', 
        minimumFractionDigits: 2,
        maximumFractionDigits: 2 
      }).format(val);
    };

    const formatSlimIDR = (val) => {
      if (!val || isNaN(val) || Number(val) === 0) return <span className="text-slate-300 font-normal">-</span>;
      const num = Number(val);
      if (Math.abs(num) >= 1e9) {
        return `Rp ${(num / 1e9).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} M`;
      }
      if (Math.abs(num) >= 1e6) {
        return `Rp ${(num / 1e6).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Jt`;
      }
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
    };

    const formatNumberInput = (val) => {
      if (!val && val !== 0) return '';
      const cleanNum = String(val).replace(/\D/g, '');
      if (!cleanNum) return '';
      return new Intl.NumberFormat('id-ID').format(cleanNum);
    };

    const formatCompactIDR = (val) => {
      if (!val) return 'Rp 0,00';
      if (val >= 1e12) return `Rp ${(val / 1e12).toFixed(2)} T`;
      if (val >= 1e9) return `Rp ${(val / 1e9).toFixed(2)} M`;
      if (val >= 1e6) return `Rp ${(val / 1e6).toFixed(2)} Jt`;
      return formatIDR(val);
    };

    const MiniSparkBar = ({ color = "teal" }) => {
      const bars = [35, 55, 40, 70, 60, 95];
      return (
        <div className="flex items-end space-x-1.5 h-12">
          {bars.map((height, idx) => (
            <div 
              key={idx} 
              style={{ height: `${height}%` }} 
              className={`w-2 rounded-t-sm transition-all duration-300 ${
                idx === bars.length - 1 
                  ? (color === "orange" ? "bg-bni-orange" : "bg-bni-teal") 
                  : (color === "orange" ? "bg-orange-200" : "bg-teal-200")
              }`}
            ></div>
          ))}
        </div>
      );
    };

    const HeatmapMatrix = ({ data, categories, wilayahs, reportMonth = 'Des' }) => {
      const { matrixData, colTotals, rowTotals, grandTotal } = useMemo(() => {
        const matrix = {};
        const colTot = {};
        const rowTot = {};
        
        categories.forEach(c => {
          colTot[c] = { alokasiEfs: 0, realisasi: 0 };
        });

        wilayahs.forEach(w => {
          matrix[w] = {};
          rowTot[w] = { alokasiEfs: 0, realisasi: 0 };
          categories.forEach(c => {
            matrix[w][c] = { alokasiEfs: 0, realisasi: 0 };
          });
        });

        let grandTot = { alokasiEfs: 0, realisasi: 0 };

        data.forEach(row => {
          const w = row.wilayah;
          let cat = row.kategori || '';
          let matchedCat = null;

          if (cat.toLowerCase().includes('bangunan')) matchedCat = "Bangunan Gedung";
          else if (cat.toLowerCase().includes('tanah')) matchedCat = "Tanah";
          else if (cat.toLowerCase().includes('otomasi') && !cat.toLowerCase().includes('non')) matchedCat = "Perabotan Otomasi";
          else if (cat.toLowerCase().includes('perabotan') || cat.toLowerCase().includes('non otomasi')) matchedCat = "Perabotan Non Otomasi";
          else if (cat.toLowerCase().includes('kendaraan')) matchedCat = "Kendaraan";

          if (w && matchedCat && matrix[w] && matrix[w][matchedCat]) {
            const efs = getEfsValue(row, reportMonth);
            const real = getCumulativeRealisasiValue(row, reportMonth);

            matrix[w][matchedCat].alokasiEfs += efs;
            matrix[w][matchedCat].realisasi += real;

            rowTot[w].alokasiEfs += efs;
            rowTot[w].realisasi += real;

            colTot[matchedCat].alokasiEfs += efs;
            colTot[matchedCat].realisasi += real;

            grandTot.alokasiEfs += efs;
            grandTot.realisasi += real;
          }
        });

        return { 
          matrixData: matrix, 
          colTotals: colTot, 
          rowTotals: rowTot, 
          grandTotal: grandTot 
        };
      }, [data, categories, wilayahs, reportMonth]);

      const getBgStylePct = (pct, alokasi) => {
        if (!alokasi || alokasi === 0) return { backgroundColor: '#FFFFFF', color: '#94A3B8' };
        if (pct === 0) return { backgroundColor: '#F15A24', color: '#FFFFFF' };
        if (pct < 30) return { backgroundColor: '#F97316', color: '#FFFFFF' };
        if (pct <= 50) return { backgroundColor: '#FB923C', color: '#FFFFFF' };
        if (pct <= 74) return { backgroundColor: '#38BDF8', color: '#0F172A' };
        return { backgroundColor: '#006666', color: '#FFFFFF' };
      };

      return (
        <div className="w-full overflow-x-auto space-y-4">
          <table className="w-full text-center border-collapse text-[10px]">
            <thead>
              <tr className="bg-[#004d4d] text-white">
                <th rowSpan="2" className="p-2 border border-teal-800 text-left w-[12%]">Wilayah</th>
                {categories.map(c => (
                  <th key={c} colSpan="3" className="p-1.5 border border-teal-800 font-extrabold uppercase text-[9px]">
                    {c}
                  </th>
                ))}
                <th colSpan="3" className="p-1.5 border border-teal-800 font-black uppercase text-[9px] bg-[#D14817]">
                  Total
                </th>
              </tr>
              <tr className="bg-[#006666] text-white">
                {categories.map(c => (
                  <React.Fragment key={`sub-${c}`}>
                    <th className="p-1 border border-teal-800 text-[8px] font-bold">Alokasi</th>
                    <th className="p-1 border border-teal-800 text-[8px] font-bold">Realisasi</th>
                    <th className="p-1 border border-teal-800 text-[8px] font-bold">%</th>
                  </React.Fragment>
                ))}
                <th className="p-1 border border-teal-800 text-[8px] font-black bg-[#F15A24]">Alokasi</th>
                <th className="p-1 border border-teal-800 text-[8px] font-black bg-[#F15A24]">Realisasi</th>
                <th className="p-1 border border-teal-800 text-[8px] font-black bg-[#F15A24]">%</th>
              </tr>
            </thead>
            <tbody>
              {wilayahs.map((w, idx) => {
                const rowItem = rowTotals[w] || { alokasiEfs: 0, realisasi: 0 };
                const rowPct = rowItem.alokasiEfs > 0 ? (rowItem.realisasi / rowItem.alokasiEfs) * 100 : 0;
                const rowBgColor = idx % 2 === 0 ? 'bg-white' : 'bg-slate-50';

                return (
                  <tr key={w} className={rowBgColor}>
                    <td className="p-1.5 font-bold text-slate-800 border border-slate-200 text-left">{w}</td>
                    {categories.map(c => {
                      const item = matrixData[w] ? matrixData[w][c] : { alokasiEfs: 0, realisasi: 0 };
                      const pct = item.alokasiEfs > 0 ? (item.realisasi / item.alokasiEfs) * 100 : 0;
                      const pctStyle = getBgStylePct(pct, item.alokasiEfs);

                      return (
                        <React.Fragment key={`${w}-${c}`}>
                          <td className="p-1 border border-slate-200 text-slate-700 font-medium whitespace-nowrap cursor-default hover:bg-slate-100" title={`${w} - ${c}\nAlokasi: ${formatIDR(item.alokasiEfs)}`}>
                            {item.alokasiEfs > 0 ? formatSlimIDR(item.alokasiEfs) : '-'}
                          </td>
                          <td className="p-1 border border-slate-200 text-slate-700 font-medium whitespace-nowrap cursor-default hover:bg-slate-100" title={`${w} - ${c}\nRealisasi: ${formatIDR(item.realisasi)}`}>
                            {item.realisasi > 0 ? formatSlimIDR(item.realisasi) : '-'}
                          </td>
                          <td style={pctStyle} className="p-1 border border-slate-200 font-extrabold whitespace-nowrap cursor-default" title={`${w} - ${c}\nAlokasi: ${formatIDR(item.alokasiEfs)}\nRealisasi: ${formatIDR(item.realisasi)}\nRealisasi (%): ${pct.toFixed(2)}%`}>
                            {item.alokasiEfs > 0 ? `${pct.toFixed(2)}%` : '-'}
                          </td>
                        </React.Fragment>
                      );
                    })}
                    <td className="p-1 border border-slate-300 font-bold text-slate-900 bg-slate-100 whitespace-nowrap cursor-default" title={`Total ${w}\nAlokasi: ${formatIDR(rowItem.alokasiEfs)}`}>
                      {rowItem.alokasiEfs > 0 ? formatSlimIDR(rowItem.alokasiEfs) : '-'}
                    </td>
                    <td className="p-1 border border-slate-300 font-bold text-slate-900 bg-slate-100 whitespace-nowrap cursor-default" title={`Total ${w}\nRealisasi: ${formatIDR(rowItem.realisasi)}`}>
                      {rowItem.realisasi > 0 ? formatSlimIDR(rowItem.realisasi) : '-'}
                    </td>
                    <td className="p-1 border border-slate-300 font-black text-slate-900 bg-slate-100 whitespace-nowrap cursor-default" title={`Total ${w}\nAlokasi: ${formatIDR(rowItem.alokasiEfs)}\nRealisasi: ${formatIDR(rowItem.realisasi)}\nRealisasi (%): ${rowPct.toFixed(2)}%`}>
                      {rowItem.alokasiEfs > 0 ? `${rowPct.toFixed(2)}%` : '-'}
                    </td>
                  </tr>
                );
              })}
              <tr className="bg-[#D14817] text-white font-black">
                <td className="p-2 border border-orange-800 text-left">Total</td>
                {categories.map(c => {
                  const colItem = colTotals[c] || { alokasiEfs: 0, realisasi: 0 };
                  const colPct = colItem.alokasiEfs > 0 ? (colItem.realisasi / colItem.alokasiEfs) * 100 : 0;
                  return (
                    <React.Fragment key={`tot-${c}`}>
                      <td className="p-1 border border-orange-800 whitespace-nowrap cursor-default" title={`Total Kategori ${c}\nAlokasi: ${formatIDR(colItem.alokasiEfs)}`}>{colItem.alokasiEfs > 0 ? formatSlimIDR(colItem.alokasiEfs) : '-'}</td>
                      <td className="p-1 border border-orange-800 whitespace-nowrap cursor-default" title={`Total Kategori ${c}\nRealisasi: ${formatIDR(colItem.realisasi)}`}>{colItem.realisasi > 0 ? formatSlimIDR(colItem.realisasi) : '-'}</td>
                      <td className="p-1 border border-orange-800 whitespace-nowrap cursor-default" title={`Total Kategori ${c}\nAlokasi: ${formatIDR(colItem.alokasiEfs)}\nRealisasi: ${formatIDR(colItem.realisasi)}\nRealisasi (%): ${colPct.toFixed(2)}%`}>{colItem.alokasiEfs > 0 ? `${colPct.toFixed(2)}%` : '-'}</td>
                    </React.Fragment>
                  );
                })}
                <td className="p-1 border border-orange-800 whitespace-nowrap cursor-default" title={`GRAND TOTAL\nAlokasi: ${formatIDR(grandTotal.alokasiEfs)}`}>{grandTotal.alokasiEfs > 0 ? formatSlimIDR(grandTotal.alokasiEfs) : '-'}</td>
                <td className="p-1 border border-orange-800 whitespace-nowrap cursor-default" title={`GRAND TOTAL\nRealisasi: ${formatIDR(grandTotal.realisasi)}`}>{grandTotal.realisasi > 0 ? formatSlimIDR(grandTotal.realisasi) : '-'}</td>
                <td className="p-1 border border-orange-800 whitespace-nowrap cursor-default" title={`GRAND TOTAL\nAlokasi: ${formatIDR(grandTotal.alokasiEfs)}\nRealisasi: ${formatIDR(grandTotal.realisasi)}\nRealisasi (%): ${(grandTotal.realisasi / grandTotal.alokasiEfs * 100).toFixed(2)}%`}>{grandTotal.alokasiEfs > 0 ? `${(grandTotal.realisasi / grandTotal.alokasiEfs * 100).toFixed(2)}%` : '-'}</td>
              </tr>
            </tbody>
          </table>
          <div className="flex flex-wrap items-center gap-2 pt-2 text-[10px] font-bold text-slate-600">
            <span>Legend:</span>
            <span className="px-2 py-0.5 bg-[#F15A24] text-white rounded">0 %</span>
            <span className="px-2 py-0.5 bg-[#F97316] text-white rounded">&lt; 30 %</span>
            <span className="px-2 py-0.5 bg-[#FB923C] text-white rounded">30 - 50 %</span>
            <span className="px-2 py-0.5 bg-[#38BDF8] text-slate-900 rounded">51 - 74 %</span>
            <span className="px-2 py-0.5 bg-[#006666] text-white rounded">&gt; 75 %</span>
          </div>
        </div>
      );
    };

    const MirrorHorizontalBarChart = ({ labels, alokasiData, pctRealisasiData }) => {
      const canvasLeftRef = useRef(null);
      const canvasRightRef = useRef(null);
      const chartLeftRef = useRef(null);
      const chartRightRef = useRef(null);

      useEffect(() => {
        if (!canvasLeftRef.current || !canvasRightRef.current) return;

        const ctxLeft = canvasLeftRef.current.getContext('2d');
        if (chartLeftRef.current) chartLeftRef.current.destroy();

        chartLeftRef.current = new Chart(ctxLeft, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Total Alokasi',
              data: alokasiData,
              backgroundColor: '#006666',
              borderRadius: 4
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (ctx) => ` Alokasi: ${formatIDR(ctx.raw)}` } }
            },
            scales: {
              x: {
                reverse: true,
                ticks: {
                  callback: (val) => val >= 1e9 ? `${(val/1e9).toFixed(0)}M` : val >= 1e6 ? `${(val/1e6).toFixed(0)}Jt` : val,
                  font: { size: 9 }
                },
                grid: { color: '#EDF2F7' }
              },
              y: {
                position: 'right',
                ticks: { font: { size: 10, weight: 'bold' } },
                grid: { display: false }
              }
            }
          }
        });

        const ctxRight = canvasRightRef.current.getContext('2d');
        if (chartRightRef.current) chartRightRef.current.destroy();

        chartRightRef.current = new Chart(ctxRight, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: '% Realisasi',
              data: pctRealisasiData,
              backgroundColor: '#F15A24',
              borderRadius: 4
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (ctx) => ` Penyerapan Realisasi: ${ctx.raw.toFixed(2)}%` } }
            },
            scales: {
              x: {
                ticks: {
                  callback: (val) => `${val}%`,
                  font: { size: 9 }
                },
                grid: { color: '#EDF2F7' }
              },
              y: {
                position: 'left',
                ticks: { font: { size: 10, weight: 'bold' } },
                grid: { display: false }
              }
            }
          }
        });

        return () => {
          if (chartLeftRef.current) chartLeftRef.current.destroy();
          if (chartRightRef.current) chartRightRef.current.destroy();
        };
      }, [labels, alokasiData, pctRealisasiData]);

      return (
        <div className="grid grid-cols-2 gap-2 h-72">
          <div className="flex flex-col h-full">
            <div className="flex items-center justify-between pb-1 border-b mb-2 border-slate-100">
              <span className="text-xs font-extrabold text-bni-teal flex items-center space-x-1">
                <i data-lucide="bar-chart-2" className="w-3.5 h-3.5"></i>
                <span>Alokasi (EFS)</span>
              </span>
              <span className="text-[9px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">Mirror Left</span>
            </div>
            <div className="flex-1 w-full relative">
              <canvas ref={canvasLeftRef}></canvas>
            </div>
          </div>

          <div className="flex flex-col h-full">
            <div className="flex items-center justify-between pb-1 border-b mb-2 border-slate-100">
              <span className="text-xs font-extrabold text-bni-orange flex items-center space-x-1">
                <i data-lucide="percent" className="w-3.5 h-3.5"></i>
                <span>% Realisasi (vs Alokasi)</span>
              </span>
              <span className="text-[9px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">Mirror Right</span>
            </div>
            <div className="flex-1 w-full relative">
              <canvas ref={canvasRightRef}></canvas>
            </div>
          </div>
        </div>
      );
    };

    const HalfGaugeChart = ({ percentage, totalRealisasi, totalAlokasi }) => {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');
        if (chartRef.current) chartRef.current.destroy();

        const pctVal = Math.min(100, Math.max(0, Number(percentage) || 0));
        const remainingVal = Math.max(0, 100 - pctVal);

        chartRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Realisasi (%)', 'Sisa Anggaran (%)'],
            datasets: [{
              data: [pctVal, remainingVal],
              backgroundColor: ['#F15A24', '#E2E8F0'],
              borderWidth: 0,
              circumference: 180,
              rotation: 270
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '75%',
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${ctx.raw.toFixed(2)}%` } }
            }
          }
        });

        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [percentage]);

      return (
        <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between space-y-2">
          <div className="flex items-center justify-between border-b pb-2 border-slate-100">
            <h4 className="font-extrabold text-slate-800 text-sm flex items-center space-x-2">
              <i data-lucide="pie-chart" className="w-4 h-4 text-bni-orange"></i>
              <span>% Penyerapan Realisasi</span>
            </h4>
            <span className="text-[10px] font-bold text-bni-teal bg-bni-teal-subtle px-2 py-0.5 rounded-full">KPI Gauge</span>
          </div>

          <div className="relative h-48 w-full flex items-center justify-center">
            <canvas ref={canvasRef}></canvas>
            
            <div className="absolute bottom-6 flex flex-col items-center justify-center text-center">
              <span className="text-3xl font-black text-slate-800 tracking-tight">{percentage}%</span>
              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Penyerapan</span>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-2 text-center border-t pt-2.5 border-slate-100">
            <div className="bg-slate-50 p-2 rounded-xl border border-slate-100">
              <span className="text-[9px] font-bold text-slate-400 uppercase block">Alokasi EFS</span>
              <span className="font-black text-bni-teal text-xs">{formatCompactIDR(totalAlokasi)}</span>
            </div>
            <div className="bg-slate-50 p-2 rounded-xl border border-slate-100">
              <span className="text-[9px] font-bold text-slate-400 uppercase block">Realisasi</span>
              <span className="font-black text-bni-orange text-xs">{formatCompactIDR(totalRealisasi)}</span>
            </div>
          </div>
        </div>
      );
    };

    // KOMPONEN UPLOAD LAPORAN BARU (VERSI ORIGINAL)
    const UploadMonthlyReportView = ({ existingProjects, masterOutletDict, masterRekgDict, onUpdateDatabase, onUploadSuccess }) => {
      const [uploadMonth, setUploadMonth] = useState('Ags');
      const [parsedData, setParsedData] = useState([]);
      const [fileName, setFileName] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [uploadProgress, setUploadProgress] = useState(0);
      const [progressStatusText, setProgressStatusText] = useState('Memulai Sinkronisasi...');
      const [filterMode, setFilterMode] = useState('ALL');

      const existingProjectsMap = useMemo(() => {
        const map = new Map();
        existingProjects.forEach(p => {
          if (p.projectNumber) {
            const cleanKey = String(p.projectNumber).trim().toLowerCase();
            map.set(cleanKey, p);
          }
        });
        return map;
      }, [existingProjects]);

      const getColumnValue = (row, possibleHeaders) => {
        const keys = Object.keys(row);
        for (let ph of possibleHeaders) {
          const matchedKey = keys.find(k => k.trim().toLowerCase() === ph.toLowerCase());
          if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== null) {
            return row[matchedKey];
          }
        }
        return null;
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setFileName(file.name);
        setIsAnalyzing(true);

        setTimeout(() => {
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const bstr = evt.target.result;
              const wb = XLSX.read(bstr, { type: 'binary' });
              const wsName = wb.SheetNames[0];
              const ws = wb.Sheets[wsName];
              const jsonData = XLSX.utils.sheet_to_json(ws);

              const processed = jsonData.map((row, index) => {
                const rawProjNum = getColumnValue(row, [
                  'Project Number', 'PROJECT_NUMBER', 'projectNumber', 'NO_PROJECT', 'No Project', 'PROJECT NUMBER'
                ]) || '';
                const cleanProjNum = String(rawProjNum).trim();
                const lookupKey = cleanProjNum.toLowerCase();

                const dbRecord = existingProjectsMap.get(lookupKey);
                const isNew = !dbRecord && cleanProjNum !== '';

                const rawEfsExcel = getColumnValue(row, [
                  `Alokasi EFS (${uploadMonth})`, `Alokasi EFS ${uploadMonth}`, `EFS ${uploadMonth}`, `Alokasi`, 'EFS'
                ]);
                const valEfs = Number(String(rawEfsExcel || 0).replace(/[^0-9.-]+/g, "")) || 0;

                const rawRealExcel = getColumnValue(row, [
                  `Realisasi (${uploadMonth})`, `Realisasi ${uploadMonth}`, `Realisasi`, uploadMonth.toLowerCase()
                ]);
                const valReal = Number(String(rawRealExcel || 0).replace(/[^0-9.-]+/g, "")) || 0;

                const rawCoa = getColumnValue(row, ['COA', 'No. Rekg', 'Rekening', 'COA (No. Rekg)']) || '';

				const rawStatusEfs = getColumnValue(row, [
                  'Status EFS', 'STATUS_EFS', 'Status Efs', 'Status', 'STATUS'
                ]) || 'Active';

                let parsedStatusEfs = String(rawStatusEfs).trim();
                if (parsedStatusEfs.toLowerCase() === 'actived') parsedStatusEfs = 'Active';
                
                const parts = String(rawCoa).split('-');
                if (parts.length >= 3) {
                  let target10 = parts[2].trim();
                  if (masterRekgDict && masterRekgDict[target10]) {
                    parsedMataAnggaran = masterRekgDict[target10].mataAnggaran;
                    parsedKategori = masterRekgDict[target10].kategoriProject;
                  } else {
                    parsedMataAnggaran = target10;
                  }
                }

                let parsedWilayah = 'Lainnya';
                let parsedEntitas = '-';
                let parsedOpUnit = '-';
                const segs = String(cleanProjNum).split('_');
                if (segs.length >= 3) {
                  let code4 = segs[2].trim();
                  if (masterOutletDict && masterOutletDict[code4]) {
                    parsedWilayah = masterOutletDict[code4].wilayah;
                    parsedEntitas = masterOutletDict[code4].entitas;
                    parsedOpUnit = masterOutletDict[code4].operatingUnit;
                  }
                }

                let namaProj = '-';
                if (!isNew && dbRecord) {
                  namaProj = dbRecord.namaProject || '-';
                  if (parsedWilayah === 'Lainnya') parsedWilayah = dbRecord.wilayah || 'Lainnya';
                  if (parsedEntitas === '-') parsedEntitas = dbRecord.entitas || '-';
                  if (parsedOpUnit === '-') parsedOpUnit = dbRecord.operatingUnit || '-';
                } else {
                  const excelNama = getColumnValue(row, ['Nama Project', 'NAMA_PROJECT', 'Nama Proyek']);
                  if (excelNama) namaProj = String(excelNama).trim();
                }

				return {
                  id: index + 1,
                  projectNumber: cleanProjNum || '-',
                  namaProject: namaProj,
                  coa: rawCoa,
                  wilayah: parsedWilayah,
                  entitas: parsedEntitas,
                  operatingUnit: parsedOpUnit,
                  mataAnggaran: parsedMataAnggaran,
                  kategori: parsedKategori,
                  statusEfs: parsedStatusEfs, // Pastikan ada koma di sini
                  wilayahUnit: `${parsedWilayah} - ${parsedOpUnit}`,
                  alokasiEfs: valEfs,
                  realisasiBulan: valReal,
                  isNewProject: isNew,
                  dbRecord: dbRecord
                }; // Kurung kurawal objek tertutup tanpa koma di akhir
              }); // Kurung tutup untuk .map()
            
              setParsedData(processed);
            } catch (err) {
              alert("Gagal membaca file spreadsheet! Pastikan format file sesuai.");
              console.error(err);
            } finally {
              setIsAnalyzing(false);
            }
          };

          reader.readAsBinaryString(file);
        }, 50);
      };

      const uploadSummary = useMemo(() => {
        let totalNew = 0;
        let totalExisting = 0;
        let totalEfsVal = 0;
        let totalRealVal = 0;

        parsedData.forEach(item => {
          if (item.isNewProject) totalNew++;
          else totalExisting++;
          totalEfsVal += item.alokasiEfs;
          totalRealVal += item.realisasiBulan;
        });

        return {
          totalRows: parsedData.length,
          totalNew,
          totalExisting,
          totalEfsVal,
          totalRealVal
        };
      }, [parsedData]);

      const displayList = useMemo(() => {
        if (filterMode === 'NEW') return parsedData.filter(d => d.isNewProject);
        if (filterMode === 'EXISTING') return parsedData.filter(d => !d.isNewProject);
        return parsedData;
      }, [parsedData, filterMode]);

      const handleConfirmUpload = () => {
        if (parsedData.length === 0) return;
        setIsSubmitting(true);
        setUploadProgress(5);
        setProgressStatusText('Menyiapkan payload data laporan...');

        const mKey = uploadMonth.toLowerCase();

        const progressTimer = setInterval(() => {
          setUploadProgress(prev => {
            if (prev < 40) {
              setProgressStatusText('Menyelaraskan data Project Number Baru & Eksisting...');
              return prev + 12;
            } else if (prev < 80) {
              setProgressStatusText('Menulis ke Sheet ALOKASI & REALISASI Google Sheets...');
              return prev + 8;
            } else if (prev < 95) {
              setProgressStatusText('Menyelesaikan verifikasi data backend...');
              return prev + 3;
            }
            return prev;
          });
        }, 180);

        const onBackendSuccess = (res) => {
          clearInterval(progressTimer);
          setUploadProgress(100);
          setProgressStatusText('Proses Penyimpanan Selesai 100%!');

          setTimeout(() => {
            setIsSubmitting(false);
            if (onUpdateDatabase) {
              onUpdateDatabase(parsedData, mKey);
            }
            alert(`Berhasil mengunggah & menyimpan data Laporan Bulan ${uploadMonth} 2026 ke Google Sheets!`);
            if (onUploadSuccess) onUploadSuccess();
          }, 500);
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(onBackendSuccess)
            .withFailureHandler((err) => {
              clearInterval(progressTimer);
              setIsSubmitting(false);
              alert("Gagal menyimpan ke Google Sheets backend: " + err.message);
            })
            .uploadMonthlyReportData(parsedData, mKey);
        } else {
          fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'uploadMonthlyReport',
              uploadData: parsedData,
              monthKey: mKey
            })
          })
          .then(() => {
            onBackendSuccess({ success: true });
          })
          .catch((err) => {
            clearInterval(progressTimer);
            setIsSubmitting(false);
            alert("Gagal mengirim data upload: " + err.toString());
          });
        }
      };

      return (
        <div className="space-y-6 animate-fadeIn relative">
          
          {isSubmitting && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
              <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-md w-full border border-slate-100 space-y-4">
                <div className="flex items-center space-x-3 border-b pb-3 border-slate-100">
                  <div className="p-2.5 bg-bni-orange/10 rounded-xl text-bni-orange">
                    <i data-lucide="loader-2" className="w-6 h-6 animate-spin"></i>
                  </div>
                  <div>
                    <h4 className="font-extrabold text-slate-800 text-sm">Proses Update Data Bulan {uploadMonth}</h4>
                    <p className="text-[11px] text-slate-400">Sinkronisasi Database Google Sheets</p>
                  </div>
                </div>

                <div className="space-y-2">
                  <div className="flex justify-between items-center text-xs font-bold">
                    <span className="text-slate-600">{progressStatusText}</span>
                    <span className="text-bni-orange">{uploadProgress}%</span>
                  </div>

                  <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden p-0.5 border border-slate-200">
                    <div 
                      className="bg-gradient-to-r from-bni-teal to-bni-orange h-full rounded-full transition-all duration-300 shadow-sm"
                      style={{ width: `${uploadProgress}%` }}
                    ></div>
                  </div>
                </div>

                <p className="text-[10px] text-slate-400 text-center italic pt-1">
                  Mohon jangan menutup halaman saat proses sinkronisasi berlangsung.
                </p>
              </div>
            </div>
          )}

          <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
            <div className="flex items-center justify-between border-b pb-3 border-slate-100">
              <div>
                <h4 className="font-extrabold text-slate-800 text-base flex items-center space-x-2">
                  <i data-lucide="file-up" className="w-5 h-5 text-bni-orange"></i>
                  <span>Upload & Auto-Generate Data Laporan Bulanan Baru</span>
                </h4>
                <p className="text-xs text-slate-400 mt-0.5">
                  Sistem akan secara otomatis membandingkan Project Number pada berkas upload dengan database historis bulan sebelumnya.
                </p>
              </div>
              <span className="text-xs font-black text-bni-teal bg-bni-teal-subtle px-3 py-1 rounded-full border border-teal-200">
                Data Detector Active
              </span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
              <div className="space-y-1.5">
                <label className="text-xs font-bold text-slate-600 block">Pilih Bulan Laporan Baru:</label>
                <select 
                  value={uploadMonth} 
                  onChange={e => setUploadMonth(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 text-slate-800 font-bold text-xs p-2.5 rounded-xl focus:outline-none focus:border-bni-teal"
                >
                  {MONTHS.map(m => (
                    <option key={m} value={m}>{m} 2026</option>
                  ))}
                </select>
              </div>

              <div className="md:col-span-2 space-y-1.5">
                <label className="text-xs font-bold text-slate-600 block">File Excel / CSV Laporan Bulan Terbaru:</label>
                <div className="relative flex items-center">
                  <input 
                    type="file" 
                    accept=".xlsx, .xls, .csv" 
                    onChange={handleFileUpload}
                    className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-bni-teal file:text-white hover:file:bg-bni-teal-dark cursor-pointer bg-slate-50 border border-slate-200 rounded-xl"
                  />
                </div>
              </div>
            </div>
          </div>

          {isAnalyzing && (
            <div className="bg-white p-12 rounded-2xl border border-slate-200 text-center space-y-3">
              <i data-lucide="loader-2" className="w-8 h-8 animate-spin text-bni-teal mx-auto"></i>
              <p className="text-xs font-bold text-slate-600">Menganalisis file & mendeteksi Project Number baru...</p>
            </div>
          )}

          {parsedData.length > 0 && !isAnalyzing && (
            <div className="space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                  <span className="text-[10px] font-bold text-slate-400 uppercase block">Total Proyek Di-upload</span>
                  <span className="text-2xl font-black text-slate-800 mt-1 block">{uploadSummary.totalRows}</span>
                  <span className="text-[10px] text-slate-400">Proyek tercatat dalam file</span>
                </div>

                <div className="bg-amber-50/80 p-4 rounded-2xl border border-amber-200 shadow-sm">
                  <span className="text-[10px] font-bold text-amber-800 uppercase block">Project Number Baru Terdeteksi</span>
                  <div className="flex items-center justify-between mt-1">
                    <span className="text-2xl font-black text-amber-900">{uploadSummary.totalNew}</span>
                    <span className="bg-amber-200 text-amber-900 font-extrabold text-[9px] px-2 py-0.5 rounded-full">Belum Ada Sebelumnya</span>
                  </div>
                  <span className="text-[10px] text-amber-700 block mt-0.5">Otomatis Ditambahkan ke Laporan</span>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                  <span className="text-[10px] font-bold text-slate-400 uppercase block">Proyek Eksisting (Lama)</span>
                  <span className="text-2xl font-black text-blue-700 mt-1 block">{uploadSummary.totalExisting}</span>
                  <span className="text-[10px] text-slate-400">Tercatat pada laporan lalu</span>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                  <span className="text-[10px] font-bold text-slate-400 uppercase block">Total Alokasi EFS ({uploadMonth})</span>
                  <span className="text-lg font-black text-bni-teal mt-1 block">{formatCompactIDR(uploadSummary.totalEfsVal)}</span>
                  <span className="text-[10px] text-slate-400">{formatIDR(uploadSummary.totalEfsVal)}</span>
                </div>
              </div>

              <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm flex flex-col overflow-hidden">
                <div className="p-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3 bg-slate-50/50">
                  <div>
                    <h5 className="font-extrabold text-slate-800 text-sm">Pratinjau (Preview) & Hasil Deteksi Otomatis</h5>
                    <p className="text-xs text-slate-400">Menampilkan rincian data hasil auto-generate sebelum disimpan ke sistem</p>
                  </div>

                  <div className="flex items-center space-x-2">
                    <button 
                      onClick={() => setFilterMode('ALL')}
                      className={`px-3 py-1 rounded-lg text-xs font-bold ${filterMode === 'ALL' ? 'bg-bni-teal text-white' : 'bg-slate-100 text-slate-600'}`}
                    >
                      Semua ({parsedData.length})
                    </button>
                    <button 
                      onClick={() => setFilterMode('NEW')}
                      className={`px-3 py-1 rounded-lg text-xs font-bold ${filterMode === 'NEW' ? 'bg-amber-600 text-white' : 'bg-amber-50 text-amber-800 border border-amber-200'}`}
                    >
                      Proyek Baru ({uploadSummary.totalNew})
                    </button>
                    <button 
                      onClick={() => setFilterMode('EXISTING')}
                      className={`px-3 py-1 rounded-lg text-xs font-bold ${filterMode === 'EXISTING' ? 'bg-slate-700 text-white' : 'bg-slate-100 text-slate-600'}`}
                    >
                      Proyek Eksisting ({uploadSummary.totalExisting})
                    </button>
                  </div>
                </div>

                <div className="overflow-x-auto max-h-[400px] custom-scrollbar">
                  <table className="w-full text-left text-xs text-slate-600">
                    <thead className="bg-slate-100 text-slate-600 font-extrabold uppercase text-[9px] sticky top-0 border-b border-slate-200">
                      <tr>
                        <th className="py-2.5 px-3 text-center">No</th>
                        <th className="py-2.5 px-3">Status</th>
                        <th className="py-2.5 px-3">Project Number</th>
                        <th className="py-2.5 px-3">Nama Project</th>
                        <th className="py-2.5 px-3">COA (No. Rekg)</th>
                        <th className="py-2.5 px-3">Wilayah</th>
                        <th className="py-2.5 px-3">Entitas</th>
                        <th className="py-2.5 px-3">Operating Unit</th>
                        <th className="py-2.5 px-3">Mata Anggaran</th>
                        <th className="py-2.5 px-3">Kategori</th>
						<th className="py-2.5 px-3">Status EFS</th>
                        <th className="py-2.5 px-3 text-right">Alokasi EFS ({uploadMonth})</th>
                        <th className="py-2.5 px-3 text-right">Realisasi ({uploadMonth})</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {displayList.map((row, idx) => (
                        <tr key={idx} className={row.isNewProject ? "bg-amber-50/40 hover:bg-amber-50 transition-colors" : "hover:bg-slate-50 transition-colors"}>
                          <td className="py-2 px-3 text-center font-bold text-slate-400">{idx + 1}</td>
                          <td className="py-2 px-3">
                            {row.isNewProject ? (
                              <span className="bg-amber-100 text-amber-800 font-black text-[9px] px-2 py-0.5 rounded-full border border-amber-300 inline-flex items-center space-x-1">
                                <i data-lucide="sparkles" className="w-3 h-3"></i>
                                <span>BARU</span>
                              </span>
                            ) : (
                              <span className="bg-slate-100 text-slate-500 font-bold text-[9px] px-2 py-0.5 rounded-full">
                                EKSISTING
                              </span>
                            )}
                          </td>
                          <td className="py-2 px-3 font-extrabold text-bni-teal">{row.projectNumber}</td>
                          <td className="py-2 px-3 font-bold text-slate-800">{row.namaProject}</td>
                          <td className="py-2 px-3 font-mono text-[10px] text-slate-500">{row.coa || '-'}</td>
                          <td className="py-2 px-3">{row.wilayah}</td>
                          <td className="py-2 px-3">{row.entitas}</td>
                          <td className="py-2 px-3">{row.operatingUnit}</td>
                          <td className="py-2 px-3 font-semibold text-slate-700">{row.mataAnggaran}</td>
                          <td className="py-2 px-3 font-semibold text-slate-700">{row.kategori}</td>
						  <td className="py-2 px-3 font-bold text-slate-700">{row.statusEfs}</td>
                          <td className="py-2 px-3 text-right font-semibold text-blue-700">{formatSlimIDR(row.alokasiEfs)}</td>
                          <td className="py-2 px-3 text-right font-extrabold text-bni-orange">{formatSlimIDR(row.realisasiBulan)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
                  <span className="text-xs text-slate-500 font-medium">
                    File: <b className="text-slate-800">{fileName}</b> ({parsedData.length} Baris Data)
                  </span>

                  <button 
                    onClick={handleConfirmUpload}
                    disabled={isSubmitting}
                    className="bg-bni-orange hover:bg-bni-orange-dark text-white font-bold px-6 py-2.5 rounded-xl text-xs transition-all shadow-md flex items-center space-x-2 disabled:opacity-50 cursor-pointer"
                  >
                    <i data-lucide="check-circle-2" className="w-4 h-4"></i>
                    <span>Konfirmasi & Simpan Laporan {uploadMonth}</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // KOMPONEN HISTORICAL ANALYSIS VIEW
	const HistoricalAnalysisView = ({ data }) => {
      const [m1, setM1] = useState('Jun');
      const [m2, setM2] = useState('Jul');
      const [searchQuery, setSearchQuery] = useState('');
      const [diffFilter, setDynamicDiffFilter] = useState('ALL');
      const [histSortConfig, setHistSortConfig] = useState({ key: null, direction: 'asc' });
      
      const canvasHistRef = useRef(null);
      const chartHistRef = useRef(null);

      const monthlySummary = useMemo(() => {
        return MONTHS.map((m) => {
          let efsTot = 0;
          let realTot = 0;

          data.forEach(item => {
            efsTot += getEfsValue(item, m);
            realTot += getCumulativeRealisasiValue(item, m);
          });

          const pct = efsTot > 0 ? (realTot / efsTot) * 100 : 0;
          return { month: m, alokasi: efsTot, realisasi: realTot, pct };
        });
      }, [data]);

      useEffect(() => {
        if (!canvasHistRef.current) return;
        const ctx = canvasHistRef.current.getContext('2d');
        if (chartHistRef.current) chartHistRef.current.destroy();

        chartHistRef.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: monthlySummary.map(d => d.month),
            datasets: [
              {
                type: 'line',
                label: '% Realisasi vs EFS',
                data: monthlySummary.map(d => d.pct),
                borderColor: '#F15A24',
                backgroundColor: '#F15A24',
                borderWidth: 3,
                yAxisID: 'y1',
                tension: 0.3
              },
              {
                type: 'bar',
                label: 'Alokasi EFS Bulanan',
                data: monthlySummary.map(d => d.alokasi),
                backgroundColor: '#006666',
                borderRadius: 4,
                yAxisID: 'y'
              },
              {
                type: 'bar',
                label: 'Realisasi Kumulatif Bulanan',
                data: monthlySummary.map(d => d.realisasi),
                backgroundColor: '#0D9488',
                borderRadius: 4,
                yAxisID: 'y'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
              y: {
                type: 'linear',
                display: true,
                position: 'left',
                ticks: {
                  callback: (val) => val >= 1e9 ? `${(val/1e9).toFixed(1)}M` : val >= 1e6 ? `${(val/1e6).toFixed(0)}Jt` : val
                },
                grid: { color: '#F1F5F9' }
              },
              y1: {
                type: 'linear',
                display: true,
                position: 'right',
                ticks: { callback: (val) => `${val.toFixed(0)}%` },
                grid: { drawOnChartArea: false }
              }
            }
          }
        });

        return () => { if (chartHistRef.current) chartHistRef.current.destroy(); };
      }, [monthlySummary]);

      const handleHistSort = (key) => {
        let direction = 'asc';
        if (histSortConfig.key === key && histSortConfig.direction === 'asc') {
          direction = 'desc';
        }
        setHistSortConfig({ key, direction });
      };

      const renderHistSortIcon = (columnKey) => {
        if (histSortConfig.key !== columnKey) {
          return <span className="ml-1 text-slate-300 hover:text-slate-500">↕</span>;
        }
        return histSortConfig.direction === 'asc' 
          ? <span className="ml-1 text-bni-teal font-extrabold">▲</span> 
          : <span className="ml-1 text-bni-teal font-extrabold">▼</span>;
      };

      const varianceData = useMemo(() => {
        let list = data.map(item => {
          const efs1 = getEfsValue(item, m1);
          const efs2 = getEfsValue(item, m2);
          const diffEfs = efs2 - efs1;

          const real1 = getCumulativeRealisasiValue(item, m1);
          const real2 = getCumulativeRealisasiValue(item, m2);
          const diffReal = real2 - real1;

          return {
            ...item,
            efs1,
            efs2,
            diffEfs,
            real1,
            real2,
            diffReal
          };
        });

        list = list.filter(item => {
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const matchName = (item.namaProject || '').toLowerCase().includes(q);
            const matchNum = (item.projectNumber || '').toLowerCase().includes(q);
            const matchWil = (item.wilayah || '').toLowerCase().includes(q);
            if (!matchName && !matchNum && !matchWil) return false;
          }

          if (diffFilter === 'CHANGED') return item.diffEfs !== 0 || item.diffReal !== 0;
          if (diffFilter === 'INCREASED') return item.diffEfs > 0;
          if (diffFilter === 'DECREASED') return item.diffEfs < 0;

          return true;
        });

        if (histSortConfig.key !== null) {
          list.sort((a, b) => {
            let aVal = a[histSortConfig.key];
            let bVal = b[histSortConfig.key];

            if (aVal === undefined || aVal === null) aVal = '';
            if (bVal === undefined || bVal === null) bVal = '';

            if (typeof aVal === 'string') aVal = aVal.toLowerCase();
            if (typeof bVal === 'string') bVal = bVal.toLowerCase();

            if (aVal < bVal) return histSortConfig.direction === 'asc' ? -1 : 1;
            if (aVal > bVal) return histSortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }

        return list;
      }, [data, m1, m2, searchQuery, diffFilter, histSortConfig]);

      const varianceStats = useMemo(() => {

        return {

      const exportHistToExcel = () => {

    // KOMPONEN HALAMAN PROGNOSA
    const PrognosaView = () => {
      const [loading, setLoading] = useState(true);
      const [progData, setProgData] = useState([]);
      const [wilayahFilter, setWilayahFilter] = useState('ALL');
      const [unitFilter, setUnitFilter] = useState('ALL');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [searchTerm, setSearchTerm] = useState('');
      const [modalInfo, setModalInfo] = useState({ show: false, status: '', projectNum: '', projectName: '', payload: '' });

      const PROGNOSA_API_URL = "https://script.google.com/macros/s/AKfycbz4TWK_hRVdz-Dsdpy0RGko2-rQFuqG6aA25UUJlcOxN7uXlGCFrWdgIOttVun5LxLk/exec";

      useEffect(() => {
        fetch(`${PROGNOSA_API_URL}?action=get_data`)
          .then(res => res.json())
          .then(result => {
            setLoading(false);
            const projects = result.projects || [];
            const details = result.confirmedDetails || {};
            const rejected = result.rejectedProjects || [];

            let activeMapped = projects
              .filter(p => p.IsConfirmedState === true)
              .map(p => {
                let d = details[p.Project_Number] || null;
                if(d) { d.projectStatus = "Aktif"; }
                return { base: p, detail: d };
              });

            let rejectedMapped = rejected.map(r => ({
              base: { Wilayah: r.Wilayah, Project_Number: r.Project_Number, Nama_Project: r.Nama_Project, Alokasi_ENP: r.Alokasi_ENP },
              detail: {
                entitas: r.Entitas,
                operatingUnit: r.Operating_Unit,
                alokasiValue: parseFloat(r.Alokasi_ENP || 0),
                alokasiStatus: "Dropped",
                projectStatus: "Non Aktif",
                totalRealisasi: 0,
                alasanDropped: r.User_Executor || "Takeout / Batal.",
                months: { jan:0, feb:0, mar:0, apr:0, mei:0, jun:0, jul:0, aug:0, sep:0, oct:0, nov:0, dec:0 }
              }
            }));

            let combined = activeMapped.concat(rejectedMapped).sort((a, b) => {
              let wilA = (a.base.Wilayah || "").toString().toUpperCase();
              let wilB = (b.base.Wilayah || "").toString().toUpperCase();
              return wilA.localeCompare(wilB);
            });

            setProgData(combined);
          })
          .catch(err => {
            console.error(err);
            setLoading(false);
          });
      }, []);

      const wilayahList = useMemo(() => {
        const setW = new Set();
        progData.forEach(item => { if (item.base.Wilayah) setW.add(item.base.Wilayah); });
        return Array.from(setW).sort();
      }, [progData]);

      const unitList = useMemo(() => {
        const setU = new Set();
        progData.forEach(item => {
          if (item.detail && (wilayahFilter === 'ALL' || item.base.Wilayah === wilayahFilter)) {
            setU.add(`${item.detail.entitas}|${item.detail.operatingUnit}`);
          }
        });
        return Array.from(setU).sort();
      }, [progData, wilayahFilter]);

      const filteredList = useMemo(() => {
        return progData.filter(item => {
          if (!item.detail) return false;
          const matchWilayah = (wilayahFilter === 'ALL' || item.base.Wilayah === wilayahFilter);
          let matchUnit = true;
          if (unitFilter !== 'ALL') {
            matchUnit = (`${item.detail.entitas}|${item.detail.operatingUnit}` === unitFilter);
          }
          const matchStatus = (statusFilter === 'ALL' || item.detail.projectStatus === statusFilter);
          const matchSearch = item.base.Project_Number.toLowerCase().includes(searchTerm.toLowerCase()) || 
                             item.base.Nama_Project.toLowerCase().includes(searchTerm.toLowerCase());
          return matchWilayah && matchUnit && matchStatus && matchSearch;
        });
      }, [progData, wilayahFilter, unitFilter, statusFilter, searchTerm]);

      const kpiValues = useMemo(() => {
        let count = filteredList.length;
        let totalEnp = 0;
        let totalReal = 0;
        filteredList.forEach(item => {
          totalEnp += parseFloat(item.detail.alokasiValue || 0);
          totalReal += parseFloat(item.detail.totalRealisasi || 0);
        });
        return { count, totalEnp, totalReal };
      }, [filteredList]);

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">

          {modalInfo.show && (

    // KOMPONEN UTAMA APP
    function App() {
      const [rawData, setRawData] = useState([]);
      const [detailNonOtomasiData, setDetailNonOtomasiData] = useState([]);
      const [masterOutletDict, setMasterOutletDict] = useState({});
      const [masterRekgDict, setMasterRekgDict] = useState({});
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      
      const [selectedGroup, setSelectedGroup] = useState('ALL');
      const [selectedWilayah, setSelectedWilayah] = useState('ALL');
      const [selectedUnit, setSelectedUnit] = useState('ALL');

      const [reportMonth, setReportMonth] = useState('Jul');

      const [tableSearchTerm, setTableSearchTerm] = useState('');
      const [tableWilayahFilter, setTableWilayahFilter] = useState('ALL');
      const [tableKategoriFilter, setTableKategoriFilter] = useState('ALL');
      const [tableStatusProjFilter, setTableStatusProjFilter] = useState('ALL');
      const [tableStatusEnpFilter, setTableStatusEnpFilter] = useState('ALL');
      const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });

      // -- STATE FILTER MULTI-PILIHAN UNTUK KATEGORI PROYEK & STATUS EFS --
      const [tableKatProjectFilter, setTableKatProjectFilter] = useState([]); // Array multi-pilihan
      const [tableStatusEfsFilter, setTableStatusEfsFilter] = useState([]);   // Array multi-pilihan

      const [topSearchTerm, setTopSearchTerm] = useState('');
      const [bottomSearchTerm, setBottomSearchTerm] = useState('');
      
      const [activeTab, setActiveTab] = useState(() => {
        return localStorage.getItem('bni_capex_active_tab') || 'overview';
      }); 

      useEffect(() => {
        localStorage.setItem('bni_capex_active_tab', activeTab);
      }, [activeTab]); 

      const [projectsMenuOpen, setProjectsMenuOpen] = useState(true);

      const [selectedProjectForModal, setSelectedProjectForModal] = useState(null);
      const [realisasiInputs, setRealisasiInputs] = useState({});

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      useEffect(() => {
        loadData();
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, currentPage, loading, selectedProjectForModal]);

      useEffect(() => {
        setCurrentPage(1);
      }, [selectedGroup, selectedWilayah, selectedUnit, activeTab, itemsPerPage, tableSearchTerm, tableWilayahFilter, tableKategoriFilter, tableStatusProjFilter, tableStatusEnpFilter, tableKatProjectFilter, tableStatusEfsFilter, sortConfig]);

      const loadData = () => {
        setLoading(true);
        const handleSuccess = (res) => {
          const parsed = typeof res === 'string' ? JSON.parse(res) : res;
          if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
            setRawData(parsed.overview || []);
            setDetailNonOtomasiData(parsed.detailNonOtomasi || []);
            setMasterOutletDict(parsed.outletDict || {}); 
            setMasterRekgDict(parsed.rekgDict || {});     
          } else {
            setRawData(Array.isArray(parsed) ? parsed : []);
            setDetailNonOtomasiData([]);
          }
          setLoading(false);
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(handleSuccess)
            .withFailureHandler(() => setLoading(false))
            .getDataFromSheets();
        } else {
          fetch(`${WEB_APP_URL}?action=getData`)
            .then(res => res.json())
            .then(handleSuccess)
            .catch((err) => {
              console.error("Gagal memuat data:", err);
              setLoading(false);
            });
        }
      };

		// SUMBER DATA UTAMA (Overview difilter hanya Active, Draft, In Process)
      const activeSourceData = useMemo(() => {
        if (activeTab === 'overview') {
          return rawData.filter(item => {
            const sEfs = String(item.statusEfs || 'Active').trim().toLowerCase();
            return sEfs === 'active' || sEfs === 'draft' || sEfs === 'in process';
          });
        }
        return rawData;
      }, [rawData, activeTab]);

      const handleUpdateDatabaseFromUpload = (uploadItems, monthKey) => {
        setRawData(prevData => {
          const updatedList = [...prevData];
          const dbMap = new Map();
          
          updatedList.forEach((item, index) => {
            if (item.projectNumber) {
              dbMap.set(String(item.projectNumber).trim().toLowerCase(), index);
            }
          });

          uploadItems.forEach(uItem => {
            const key = String(uItem.projectNumber).trim().toLowerCase();
            if (dbMap.has(key)) {
              const idx = dbMap.get(key);
              updatedList[idx] = {
                ...updatedList[idx],
                [`efs_${monthKey}`]: uItem.alokasiEfs,
                alokasiEfs: uItem.alokasiEfs,
                [monthKey]: uItem.realisasiBulan
              };
            } else {
              const newProjObj = {
                rowId: `NEW_${Date.now()}_${Math.random()}`,
                projectNumber: uItem.projectNumber,
                namaProject: uItem.namaProject || '-',
                wilayah: uItem.wilayah || 'Lainnya',
                operatingUnit: uItem.operatingUnit || '-',
                kategori: uItem.kategori || 'Bangunan Gedung',
                typeGroup: 'WILAYAH',
                statusProject: 'AKTIF',
                statusEnp: 'OK',
                alokasiAwal: 0,
                alokasiRevisiRbb: 0,
                alokasiEfs: uItem.alokasiEfs,
                [`efs_${monthKey}`]: uItem.alokasiEfs,
                [monthKey]: uItem.realisasiBulan
              };
              updatedList.push(newProjObj);
            }
          });

          return updatedList;
        });

        const matchedMonth = MONTHS.find(m => m.toLowerCase() === monthKey);
        if (matchedMonth) {
          setReportMonth(matchedMonth);
        }
      };

      const handleOpenDetailModal = (project) => {
        setSelectedProjectForModal(project);
        const initialInputs = {};
        MONTHS.forEach(m => {
          const key = m.toLowerCase();
          const existingValue = project[key] || 0;
          initialInputs[key] = formatNumberInput(existingValue);
        });
        setRealisasiInputs(initialInputs);
      };

      const handleRealisasiInputChange = (monthKey, rawValue) => {
        const formatted = formatNumberInput(rawValue);
        setRealisasiInputs(prev => ({
          ...prev,
          [monthKey]: formatted
        }));
      };

      const handleSaveRealisasi = () => {
        if (!selectedProjectForModal) return;
        setSaving(true);

        const rowId = selectedProjectForModal.rowId;
        const parsedInputs = {};
        MONTHS.forEach(m => {
          const key = m.toLowerCase();
          const raw = realisasiInputs[key] || '0';
          parsedInputs[key] = Number(String(raw).replace(/\D/g, '')) || 0;
        });

        const onSaveSuccess = (res) => {
          setSaving(false);
          let response = res;
          if (typeof res === 'string') {
            try { response = JSON.parse(res); } catch(e) {}
          }
          
          if (response && response.success) {
            alert(response.message || "Realisasi berhasil disimpan!");
            
            const updateState = (dataArr) => dataArr.map(item => {
              if (item.rowId === rowId) {
                return { ...item, ...parsedInputs };
              }
              return item;
            });

            setRawData(prev => updateState(prev));
            setDetailNonOtomasiData(prev => updateState(prev));
            setSelectedProjectForModal(null);
          } else {
            alert("Gagal menyimpan: " + (response ? response.message : "Error terjadi."));
          }
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(onSaveSuccess)
            .withFailureHandler((err) => {
              setSaving(false);
              alert("Gagal terhubung ke Server: " + err.message);
            })
            .saveRealisasiData(rowId, parsedInputs);
        } else {
          fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'saveData',
              rowId: rowId,
              monthlyInputs: parsedInputs
            })
          })
          .then(() => {
            onSaveSuccess({ 
              success: true, 
              message: "Data realisasi berhasil dikirim!" 
            });
          })
          .catch((err) => {
            setSaving(false);
            alert("Gagal mengirim data: " + err.toString());
          });
        }
      };

      
      const wilayahList = useMemo(() => {
        const source = selectedGroup === 'ALL' 
          ? activeSourceData 
          : activeSourceData.filter(i => i.typeGroup === selectedGroup);
        return Array.from(new Set(source.map(item => item.wilayah))).filter(Boolean).sort();
      }, [activeSourceData, selectedGroup]);

      const unitList = useMemo(() => {
        let source = activeSourceData;
        if (selectedGroup !== 'ALL') source = source.filter(i => i.typeGroup === selectedGroup);
        if (selectedWilayah !== 'ALL') source = source.filter(i => i.wilayah === selectedWilayah);

        const setUnits = new Set();
        source.forEach(row => {
          const entit = (row.entitas || '').trim();
          let opUnit = (row.operatingUnit || '').trim().replace(/\s*-\s*/g, ' ');
          if (entit && opUnit) {
            setUnits.add(`[${entit}] ${opUnit}`);
          } else if (opUnit) {
            setUnits.add(opUnit);
          }
        });
        return Array.from(setUnits).sort();
      }, [activeSourceData, selectedGroup, selectedWilayah]);

      const kategoriList = useMemo(() => {
        return ["Bangunan Gedung", "Tanah", "Perabotan Otomasi", "Perabotan Non Otomasi", "Kendaraan"];
      }, []);

      // -- DAFTAR DINAMIS PILIHAN KATEGORI PROJECT & STATUS EFS DARI DATA --
      const availableKatProjects = useMemo(() => {
        const s = new Set();
        rawData.forEach(item => {
          if (item.kategoriProject) s.add(String(item.kategoriProject).trim());
        });
        return Array.from(s).sort();
      }, [rawData]);

      const availableStatusEfs = useMemo(() => {
        const s = new Set();
        rawData.forEach(item => {
          let st = item.statusEfs ? String(item.statusEfs).trim() : 'Active';
          if (st.toLowerCase() === 'actived') st = 'Active';
          s.add(st);
        });
        return Array.from(s).sort();
      }, [rawData]);

      const statusEnpList = useMemo(() => {
        const setEnp = new Set(rawData.map(i => i.statusEnp).filter(Boolean));
        return Array.from(setEnp).sort();
      }, [rawData]);

      const filteredData = useMemo(() => {
        return activeSourceData.filter(item => {
          const matchGroup = selectedGroup === 'ALL' || item.typeGroup === selectedGroup;
          const matchWilayah = selectedWilayah === 'ALL' || item.wilayah === selectedWilayah;
          
          let matchKategori = true;
          if (activeTab !== 'overview' && activeTab !== 'historical' && activeTab !== 'upload' && activeTab !== 'prognosa') {
            let cat = (item.kategori || '').toLowerCase();
            if (activeTab === 'Bangunan Gedung') {
              matchKategori = cat.includes('bangunan') || cat.includes('gedung');
            } else if (activeTab === 'Tanah') {
              matchKategori = cat.includes('tanah');
            } else if (activeTab === 'Perabotan Otomasi') {
              matchKategori = cat.includes('otomasi') && !cat.includes('non');
            } else if (activeTab === 'Perabotan Non Otomasi') {
              matchKategori = cat.includes('perabotan non') || cat === 'perabotan non otomasi' || cat.includes('non-otomasi');
            } else if (activeTab === 'Kendaraan') {
              matchKategori = cat.includes('kendaraan') || cat.includes('mobil') || cat.includes('motor') || cat.includes('dinas');
            }
          }

          let matchUnit = true;
          if (selectedUnit !== 'ALL') {
            const entit = (item.entitas || '').trim();
            let opUnit = (item.operatingUnit || '').trim().replace(/\s*-\s*/g, ' ');
            const formatted = (entit && opUnit) ? `[${entit}] ${opUnit}` : opUnit;
            matchUnit = formatted === selectedUnit;
          }

          return matchGroup && matchWilayah && matchKategori && matchUnit;
        });
      }, [activeSourceData, selectedGroup, selectedWilayah, selectedUnit, activeTab]);

      const stats = useMemo(() => {
        let sumAlokasiAwal = 0;
        let sumAlokasiRevisiRbb = 0;
        let sumAlokasiEfs = 0;
        let totalRealisasi = 0;
        let totalProject = 0;
        let totalAktif = 0;
        let totalNonAktif = 0;

        filteredData.forEach(row => {
          sumAlokasiAwal += Number(row.alokasiAwal) || 0;
          sumAlokasiRevisiRbb += Number(row.alokasiRevisiRbb) || 0;

          const efsVal = getEfsValue(row, reportMonth);
          sumAlokasiEfs += efsVal;

          const realVal = getCumulativeRealisasiValue(row, reportMonth);
          totalRealisasi += realVal;

          totalProject += 1;
          if (String(row.statusProject).toUpperCase() === 'NON AKTIF' || String(row.statusProject).toUpperCase() === 'DROPPED') {
            totalNonAktif += 1;
          } else {
            totalAktif += 1;
          }
        });

        const sisaBudget = Math.max(0, sumAlokasiEfs - totalRealisasi);
        const pctTotal = sumAlokasiEfs > 0 ? ((totalRealisasi / sumAlokasiEfs) * 100).toFixed(2) : '0.00';

        return { 
          sumAlokasiAwal, 
          sumAlokasiRevisiRbb, 
          sumAlokasiEfs, 
          totalRealisasi, 
          sisaBudget, 
          pctTotal, 
          totalProject, 
          totalAktif, 
          totalNonAktif
        };
      }, [filteredData, reportMonth]);

      const mappedProjectsData = useMemo(() => {
        return filteredData.map(row => {
          const aloEfs = getEfsValue(row, reportMonth);
          const finalTotalReal = getCumulativeRealisasiValue(row, reportMonth);

          const pct = aloEfs > 0 ? (finalTotalReal / aloEfs) * 100 : 0;
          let rawSe = row.statusEfs ? String(row.statusEfs).trim() : 'Active';
          if (rawSe.toLowerCase() === 'actived') rawSe = 'Active';

          return {
            ...row,
            alokasiAwal: Number(row.alokasiAwal) || 0,
            alokasiRevisiRbb: Number(row.alokasiRevisiRbb) || 0,
            aloEfs: aloEfs,
            alokasiEfs: aloEfs,
            totalReal: finalTotalReal,
            pctRealisasi: pct,
            statusEfs: rawSe,
            linkDokumenEnp: row.linkDokumenEnp || "",
            catatanPembatalan: row.catatanPembatalan || ""
          };
        });
      }, [filteredData, reportMonth]);

      const top10ProjectsList = useMemo(() => {
        let list = [...mappedProjectsData];
        if (topSearchTerm) {
          const term = topSearchTerm.toLowerCase();
          list = list.filter(p => 
            (p.namaProject || '').toLowerCase().includes(term) ||
            (p.projectNumber || '').toLowerCase().includes(term) ||
            (p.wilayah || '').toLowerCase().includes(term)
          );
        }

        return list.sort((a, b) => {
          if (b.pctRealisasi !== a.pctRealisasi) {
            return b.pctRealisasi - a.pctRealisasi;
          }
          return b.aloEfs - a.aloEfs;
        }).slice(0, 10);
      }, [mappedProjectsData, topSearchTerm]);

      const bottom10ProjectsList = useMemo(() => {
        let list = [...mappedProjectsData];
        if (bottomSearchTerm) {
          const term = bottomSearchTerm.toLowerCase();
          list = list.filter(p => 
            (p.namaProject || '').toLowerCase().includes(term) ||
            (p.projectNumber || '').toLowerCase().includes(term) ||
            (p.wilayah || '').toLowerCase().includes(term)
          );
        }

        return list.sort((a, b) => {
          if (a.pctRealisasi !== b.pctRealisasi) {
            return a.pctRealisasi - b.pctRealisasi;
          }
          return b.aloEfs - a.aloEfs;
        }).slice(0, 10);
      }, [mappedProjectsData, bottomSearchTerm]);

      const tickerStats = useMemo(() => {
        let totalAlokasiEfs = 0;
        let totalRealisasiFilter = 0;

        const mapWilayahPct = {};

        rawData.forEach(row => {
          const efs = getEfsValue(row, reportMonth);
          const real = getCumulativeRealisasiValue(row, reportMonth);

          totalAlokasiEfs += efs;
          totalRealisasiFilter += real;

          const w = row.wilayah;
          if (w) {
            if (!mapWilayahPct[w]) mapWilayahPct[w] = { efs: 0, real: 0 };
            mapWilayahPct[w].efs += efs;
            mapWilayahPct[w].real += real;
          }
        });

        const pctRealisasiTotal = totalAlokasiEfs > 0 ? ((totalRealisasiFilter / totalAlokasiEfs) * 100).toFixed(2) : '0.00';

        const listWilayahPct = Object.keys(mapWilayahPct).map(w => {
          const efs = mapWilayahPct[w].efs;
          const real = mapWilayahPct[w].real;
          const pct = efs > 0 ? (real / efs) * 100 : 0;
          return { wilayah: w, pct };
        }).sort((a, b) => b.pct - a.pct);

        return {
          totalAlokasiEfs,
          currentMonthName: reportMonth,
          totalKumulatifBulanBerjalan: totalRealisasiFilter,
          pctRealisasiTotal,
          listWilayahPct
        };
      }, [rawData, reportMonth]);

      const categorySummaryBoxes = useMemo(() => {
        const targetCats = ["Bangunan Gedung", "Tanah", "Perabotan Otomasi", "Perabotan Non Otomasi", "Kendaraan"];
        const summary = {};

        targetCats.forEach(c => {
          summary[c] = { alokasi: 0, realisasi: 0, totalProject: 0, aktif: 0, nonAktif: 0 };
        });

        rawData.forEach(row => {
          let cat = (row.kategori || '').toLowerCase().trim();
          let matchedCat = null;

          if (cat.includes('kendaraan') || cat.includes('mobil') || cat.includes('motor')) matchedCat = "Kendaraan";
          else if (cat.includes('bangunan') || cat.includes('gedung')) matchedCat = "Bangunan Gedung";
          else if (cat.includes('tanah')) matchedCat = "Tanah";
          else if (cat.includes('otomasi') && !cat.includes('non')) matchedCat = "Perabotan Otomasi";
          else if (cat.includes('perabotan') || cat.includes('non otomasi') || cat.includes('non-otomasi') || cat.includes('mebel')) matchedCat = "Perabotan Non Otomasi";

          if (matchedCat && summary[matchedCat]) {
            const pagu = getEfsValue(row, reportMonth);
            const rowReal = getCumulativeRealisasiValue(row, reportMonth);

            summary[matchedCat].alokasi += pagu;
            summary[matchedCat].realisasi += rowReal;
            summary[matchedCat].totalProject += 1;
            
            if (String(row.statusProject).toUpperCase() === 'NON AKTIF' || String(row.statusProject).toUpperCase() === 'DROPPED') {
              summary[matchedCat].nonAktif += 1;
            } else {
              summary[matchedCat].aktif += 1;
            }
          }
        });

        return summary;
      }, [rawData, reportMonth]);

      const mirrorChartData = useMemo(() => {
        const mapWilayah = {};

        rawData.forEach(row => {
          const w = row.wilayah || 'Lainnya';
          if (!mapWilayah[w]) mapWilayah[w] = { alokasi: 0, realisasi: 0, alokasiEfs: 0 };

          const paguEfs = getEfsValue(row, reportMonth);
          const rowReal = getCumulativeRealisasiValue(row, reportMonth);

          mapWilayah[w].alokasi += paguAwal;
          mapWilayah[w].alokasiEfs += paguEfs;
          mapWilayah[w].realisasi += rowReal;

            const aloEfs = mapWilayah[w].alokasiEfs;
            const rea = mapWilayah[w].realisasi;
            const pct = aloEfs > 0 ? (rea / aloEfs) * 100 : 0; 
            return { name: w, alokasi: aloEfs, pctRealisasi: pct };

          .sort((a, b) => b.alokasi - a.alokasi);

          labels: listSorted.map(item => item.name),
          alokasi: listSorted.map(item => item.alokasi),

        };
      }, [rawData, reportMonth]);

      const handleSort = (key) => {

        if (sortConfig.key === key && sortConfig.direction === 'asc') {

        setSortConfig({ key, direction });

      const tableRows = useMemo(() => {
