<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Realisasi Anggaran Investasi - BNI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bni: {
              teal: '#006666',
              'teal-dark': '#004d4d',
              'teal-subtle': '#EAF4F4',
              orange: '#F15A24',
              'orange-dark': '#D14817',
              'orange-subtle': '#FFF2EE',
              bg: '#F3F5F9'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F3F5F9; color: #1E293B; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    /* KECEPATAN ANIMAIS DIPERLAMBAT DARI 55s MENJADI 85s */
    .animate-marquee {
      display: flex;
      width: max-content;
      animation: marquee 85s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="antialiased selection:bg-bni-teal selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxf89NXCAtrjZn3bFdhtO45DfikiDn8SiYavFBDerqyzIBeUt8yiKAxXoSwOu24N9z-mA/exec";
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];

    const formatIDR = (val) => {
      if (val === undefined || val === null || isNaN(val)) return 'Rp 0,00';
      return new Intl.NumberFormat('id-ID', { 
        style: 'currency', 
        currency: 'IDR', 
        minimumFractionDigits: 2,
        maximumFractionDigits: 2 
      }).format(val);
    };

    const formatSlimIDR = (val) => {
      if (!val || isNaN(val) || Number(val) === 0) return <span className="text-slate-300 font-normal">-</span>;
      const num = Number(val);
      if (Math.abs(num) >= 1e9) {
        return `Rp ${(num / 1e9).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} M`;
      }
      if (Math.abs(num) >= 1e6) {
        return `Rp ${(num / 1e6).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Jt`;
      }
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
    };

    const formatNumberInput = (val) => {
      if (!val && val !== 0) return '';
      const cleanNum = String(val).replace(/\D/g, '');
      if (!cleanNum) return '';
      return new Intl.NumberFormat('id-ID').format(cleanNum);
    };

    const formatCompactIDR = (val) => {
      if (!val) return 'Rp 0,00';
      if (val >= 1e12) return `Rp ${(val / 1e12).toFixed(2)} T`;
      if (val >= 1e9) return `Rp ${(val / 1e9).toFixed(2)} M`;
      if (val >= 1e6) return `Rp ${(val / 1e6).toFixed(2)} Jt`;
      return formatIDR(val);
    };

    const MiniSparkBar = ({ color = "teal" }) => {
      const bars = [35, 55, 40, 70, 60, 95];
      return (
        <div className="flex items-end space-x-1.5 h-12">
          {bars.map((height, idx) => (
            <div 
              key={idx} 
              style={{ height: `${height}%` }} 
              className={`w-2 rounded-t-sm transition-all duration-300 ${
                idx === bars.length - 1 
                  ? (color === "orange" ? "bg-bni-orange" : "bg-bni-teal") 
                  : (color === "orange" ? "bg-orange-200" : "bg-teal-200")
              }`}
            ></div>
          ))}
        </div>
      );
    };

    // KOMPONEN HEATMAP MATRIX
    const HeatmapMatrix = ({ data, categories, wilayahs, type = 'efs' }) => {
      const matrixData = useMemo(() => {
        const matrix = {};
        wilayahs.forEach(w => {
          matrix[w] = {};
          categories.forEach(c => {
            matrix[w][c] = { alokasiEfs: 0, realisasi: 0 };
          });
        });

        data.forEach(row => {
          const w = row.wilayah;
          let cat = row.kategori || '';
          let matchedCat = null;

          if (cat.toLowerCase().includes('bangunan')) matchedCat = "Bangunan Gedung";
          else if (cat.toLowerCase().includes('tanah')) matchedCat = "Tanah";
          else if (cat.toLowerCase().includes('otomasi') && !cat.toLowerCase().includes('non')) matchedCat = "Perabotan Otomasi";
          else if (cat.toLowerCase().includes('perabotan')) matchedCat = "Perabotan Non Otomasi";
          else if (cat.toLowerCase().includes('kendaraan')) matchedCat = "Kendaraan";

          if (w && matchedCat && matrix[w] && matrix[w][matchedCat]) {
            const efs = Number(row.alokasiEfs) || 0;
            let real = 0;
            MONTHS.forEach(m => { real += Number(row[m.toLowerCase()]) || 0; });

            matrix[w][matchedCat].alokasiEfs += efs;
            matrix[w][matchedCat].realisasi += real;
          }
        });

        return matrix;
      }, [data, categories, wilayahs]);

      const getBgStylePct = (pct) => {
        if (pct === 0) return { backgroundColor: '#F8FAFC', color: '#94A3B8' };
        if (pct >= 85) return { backgroundColor: '#10B981', color: '#FFFFFF' };
        if (pct >= 60) return { backgroundColor: '#34D399', color: '#065F46' };
        if (pct >= 30) return { backgroundColor: '#FBBF24', color: '#78350F' };
        return { backgroundColor: '#FFEDD5', color: '#C2410C' };
      };

      const getBgStyleEfs = (val, maxVal) => {
        if (val === 0) return { backgroundColor: '#F8FAFC', color: '#94A3B8' };
        const ratio = maxVal > 0 ? val / maxVal : 0;
        if (ratio >= 0.7) return { backgroundColor: '#006666', color: '#FFFFFF' };
        if (ratio >= 0.4) return { backgroundColor: '#0D9488', color: '#FFFFFF' };
        if (ratio >= 0.15) return { backgroundColor: '#99F6E4', color: '#134E4A' };
        return { backgroundColor: '#E0F2FE', color: '#0369A1' };
      };

      const maxEfsVal = useMemo(() => {
        let max = 0;
        wilayahs.forEach(w => {
          categories.forEach(c => {
            if (matrixData[w] && matrixData[w][c]) {
              if (matrixData[w][c].alokasiEfs > max) max = matrixData[w][c].alokasiEfs;
            }
          });
        });
        return max;
      }, [matrixData, wilayahs, categories]);

      return (
        <div className="overflow-x-auto custom-scrollbar">
          <table className="w-full text-center border-collapse">
            <thead>
              <tr>
                <th className="p-2 text-[10px] font-extrabold text-slate-400 bg-slate-50 border border-slate-200 text-left">Wilayah</th>
                {categories.map(c => (
                  <th key={c} className="p-2 text-[9px] font-extrabold text-slate-600 bg-slate-50 border border-slate-200 min-w-[90px]">
                    {c}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {wilayahs.map(w => (
                <tr key={w}>
                  <td className="p-2 text-[10px] font-bold text-slate-700 bg-slate-50 border border-slate-200 text-left whitespace-nowrap">
                    {w}
                  </td>
                  {categories.map(c => {
                    const item = matrixData[w] ? matrixData[w][c] : { alokasiEfs: 0, realisasi: 0 };
                    const pct = item.alokasiEfs > 0 ? (item.realisasi / item.alokasiEfs) * 100 : 0;
                    
                    const style = type === 'pct' 
                      ? getBgStylePct(pct) 
                      : getBgStyleEfs(item.alokasiEfs, maxEfsVal);

                    return (
                      <td 
                        key={c} 
                        style={style} 
                        className="p-2 border border-slate-200 text-[10px] font-extrabold transition-all hover:scale-105 cursor-default"
                        title={`${w} - ${c}\nAlokasi EFS: ${formatIDR(item.alokasiEfs)}\nRealisasi: ${formatIDR(item.realisasi)}\n% Realisasi: ${pct.toFixed(2)}%`}
                      >
                        {type === 'pct' ? (
                          item.alokasiEfs > 0 ? `${pct.toFixed(1)}%` : '-'
                        ) : (
                          item.alokasiEfs > 0 ? formatCompactIDR(item.alokasiEfs) : '-'
                        )}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    };

    const MirrorHorizontalBarChart = ({ labels, alokasiData, pctRealisasiData }) => {
      const canvasLeftRef = useRef(null);
      const canvasRightRef = useRef(null);
      const chartLeftRef = useRef(null);
      const chartRightRef = useRef(null);

      useEffect(() => {
        if (!canvasLeftRef.current || !canvasRightRef.current) return;

        const ctxLeft = canvasLeftRef.current.getContext('2d');
        if (chartLeftRef.current) chartLeftRef.current.destroy();

        chartLeftRef.current = new Chart(ctxLeft, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Total Alokasi',
              data: alokasiData,
              backgroundColor: '#006666',
              borderRadius: 4
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (ctx) => ` Alokasi: ${formatIDR(ctx.raw)}` } }
            },
            scales: {
              x: {
                reverse: true,
                ticks: {
                  callback: (val) => val >= 1e9 ? `${(val/1e9).toFixed(0)}M` : val >= 1e6 ? `${(val/1e6).toFixed(0)}Jt` : val,
                  font: { size: 9 }
                },
                grid: { color: '#EDF2F7' }
              },
              y: {
                position: 'right',
                ticks: { font: { size: 10, weight: 'bold' } },
                grid: { display: false }
              }
            }
          }
        });

        const ctxRight = canvasRightRef.current.getContext('2d');
        if (chartRightRef.current) chartRightRef.current.destroy();

        chartRightRef.current = new Chart(ctxRight, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: '% Realisasi',
              data: pctRealisasiData,
              backgroundColor: '#F15A24',
              borderRadius: 4
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (ctx) => ` Penyerapan Realisasi: ${ctx.raw.toFixed(2)}%` } }
            },
            scales: {
              x: {
                ticks: {
                  callback: (val) => `${val}%`,
                  font: { size: 9 }
                },
                grid: { color: '#EDF2F7' }
              },
              y: {
                position: 'left',
                ticks: { font: { size: 10, weight: 'bold' } },
                grid: { display: false }
              }
            }
          }
        });

        return () => {
          if (chartLeftRef.current) chartLeftRef.current.destroy();
          if (chartRightRef.current) chartRightRef.current.destroy();
        };
      }, [labels, alokasiData, pctRealisasiData]);

      return (
        <div className="grid grid-cols-2 gap-2 h-72">
          <div className="flex flex-col h-full">
            <div className="flex items-center justify-between pb-1 border-b mb-2 border-slate-100">
              <span className="text-xs font-extrabold text-bni-teal flex items-center space-x-1">
                <i data-lucide="bar-chart-2" className="w-3.5 h-3.5"></i>
                <span>Alokasi (Kolom K)</span>
              </span>
              <span className="text-[9px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">Mirror Left</span>
            </div>
            <div className="flex-1 w-full relative">
              <canvas ref={canvasLeftRef}></canvas>
            </div>
          </div>

          <div className="flex flex-col h-full">
            <div className="flex items-center justify-between pb-1 border-b mb-2 border-slate-100">
              <span className="text-xs font-extrabold text-bni-orange flex items-center space-x-1">
                <i data-lucide="percent" className="w-3.5 h-3.5"></i>
                <span>% Realisasi (vs Alokasi)</span>
              </span>
              <span className="text-[9px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">Mirror Right</span>
            </div>
            <div className="flex-1 w-full relative">
              <canvas ref={canvasRightRef}></canvas>
            </div>
          </div>
        </div>
      );
    };

    const HalfGaugeChart = ({ percentage, totalRealisasi, totalAlokasi }) => {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');
        if (chartRef.current) chartRef.current.destroy();

        const pctVal = Math.min(100, Math.max(0, Number(percentage) || 0));
        const remainingVal = Math.max(0, 100 - pctVal);

        chartRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Realisasi (%)', 'Sisa Anggaran (%)'],
            datasets: [{
              data: [pctVal, remainingVal],
              backgroundColor: ['#F15A24', '#E2E8F0'],
              borderWidth: 0,
              circumference: 180,
              rotation: 270
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '75%',
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${ctx.raw.toFixed(2)}%` } }
            }
          }
        });

        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [percentage]);

      return (
        <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between space-y-2">
          <div className="flex items-center justify-between border-b pb-2 border-slate-100">
            <h4 className="font-extrabold text-slate-800 text-sm flex items-center space-x-2">
              <i data-lucide="pie-chart" className="w-4 h-4 text-bni-orange"></i>
              <span>% Penyerapan Realisasi</span>
            </h4>
            <span className="text-[10px] font-bold text-bni-teal bg-bni-teal-subtle px-2 py-0.5 rounded-full">KPI Gauge</span>
          </div>

          <div className="relative h-48 w-full flex items-center justify-center">
            <canvas ref={canvasRef}></canvas>
            
            <div className="absolute bottom-6 flex flex-col items-center justify-center text-center">
              <span className="text-3xl font-black text-slate-800 tracking-tight">{percentage}%</span>
              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Penyerapan</span>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-2 text-center border-t pt-2.5 border-slate-100">
            <div className="bg-slate-50 p-2 rounded-xl border border-slate-100">
              <span className="text-[9px] font-bold text-slate-400 uppercase block">Alokasi EFS</span>
              <span className="font-black text-bni-teal text-xs">{formatCompactIDR(totalAlokasi)}</span>
            </div>
            <div className="bg-slate-50 p-2 rounded-xl border border-slate-100">
              <span className="text-[9px] font-bold text-slate-400 uppercase block">Realisasi</span>
              <span className="font-black text-bni-orange text-xs">{formatCompactIDR(totalRealisasi)}</span>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [rawData, setRawData] = useState([]);
      const [detailNonOtomasiData, setDetailNonOtomasiData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      
      const [selectedGroup, setSelectedGroup] = useState('ALL');
      const [selectedWilayah, setSelectedWilayah] = useState('ALL');
      const [selectedUnit, setSelectedUnit] = useState('ALL');

      const [tableSearchTerm, setTableSearchTerm] = useState('');
      const [tableWilayahFilter, setTableWilayahFilter] = useState('ALL');
      const [tableKategoriFilter, setTableKategoriFilter] = useState('ALL');
      const [tableStatusProjFilter, setTableStatusProjFilter] = useState('ALL');
      const [tableStatusEnpFilter, setTableStatusEnpFilter] = useState('ALL');
      const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });

      const [topSearchTerm, setTopSearchTerm] = useState('');
      const [bottomSearchTerm, setBottomSearchTerm] = useState('');
      
      const [activeTab, setActiveTab] = useState('overview'); 
      const [projectsMenuOpen, setProjectsMenuOpen] = useState(true);

      const [selectedProjectForModal, setSelectedProjectForModal] = useState(null);
      const [realisasiInputs, setRealisasiInputs] = useState({});

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      useEffect(() => {
        loadData();
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, currentPage, itemsPerPage, loading, rawData, selectedProjectForModal, sortConfig, topSearchTerm, bottomSearchTerm]);

      useEffect(() => {
        setCurrentPage(1);
      }, [selectedGroup, selectedWilayah, selectedUnit, activeTab, itemsPerPage, tableSearchTerm, tableWilayahFilter, tableKategoriFilter, tableStatusProjFilter, tableStatusEnpFilter, sortConfig]);

      const loadData = () => {
        setLoading(true);
        const handleSuccess = (res) => {
          const parsed = typeof res === 'string' ? JSON.parse(res) : res;
          if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
            setRawData(parsed.overview || []);
            setDetailNonOtomasiData(parsed.detailNonOtomasi || []);
          } else {
            setRawData(Array.isArray(parsed) ? parsed : []);
            setDetailNonOtomasiData([]);
          }
          setLoading(false);
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(handleSuccess)
            .withFailureHandler(() => setLoading(false))
            .getDataFromSheets();
        } else {
          fetch(`${WEB_APP_URL}?action=getData`)
            .then(res => res.json())
            .then(handleSuccess)
            .catch((err) => {
              console.error("Gagal memuat data:", err);
              setLoading(false);
            });
        }
      };

      const handleOpenDetailModal = (project) => {
        setSelectedProjectForModal(project);
        const initialInputs = {};
        MONTHS.forEach(m => {
          const key = m.toLowerCase();
          const existingValue = project[key] || 0;
          initialInputs[key] = formatNumberInput(existingValue);
        });
        setRealisasiInputs(initialInputs);
      };

      const handleRealisasiInputChange = (monthKey, rawValue) => {
        const formatted = formatNumberInput(rawValue);
        setRealisasiInputs(prev => ({
          ...prev,
          [monthKey]: formatted
        }));
      };

      const handleSaveRealisasi = () => {
        if (!selectedProjectForModal) return;
        setSaving(true);

        const rowId = selectedProjectForModal.rowId;
        const parsedInputs = {};
        MONTHS.forEach(m => {
          const key = m.toLowerCase();
          const raw = realisasiInputs[key] || '0';
          parsedInputs[key] = Number(String(raw).replace(/\D/g, '')) || 0;
        });

        const onSaveSuccess = (res) => {
          setSaving(false);
          let response = res;
          if (typeof res === 'string') {
            try { response = JSON.parse(res); } catch(e) {}
          }
          
          if (response && response.success) {
            alert(response.message || "Realisasi berhasil disimpan!");
            
            const updateState = (dataArr) => dataArr.map(item => {
              if (item.rowId === rowId) {
                return { ...item, ...parsedInputs };
              }
              return item;
            });

            setRawData(prev => updateState(prev));
            setDetailNonOtomasiData(prev => updateState(prev));
            setSelectedProjectForModal(null);
          } else {
            alert("Gagal menyimpan: " + (response ? response.message : "Error terjadi."));
          }
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(onSaveSuccess)
            .withFailureHandler((err) => {
              setSaving(false);
              alert("Gagal terhubung ke Server: " + err.message);
            })
            .saveRealisasiData(rowId, parsedInputs);
        } else {
          fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'saveData',
              rowId: rowId,
              monthlyInputs: parsedInputs
            })
          })
          .then(() => {
            onSaveSuccess({ 
              success: true, 
              message: "Data realisasi berhasil dikirim!" 
            });
          })
          .catch((err) => {
            setSaving(false);
            alert("Gagal mengirim data: " + err.toString());
          });
        }
      };

      const activeSourceData = useMemo(() => {
        if (activeTab === 'Perabotan Non Otomasi') {
          return detailNonOtomasiData;
        }
        return rawData;
      }, [activeTab, rawData, detailNonOtomasiData]);

      const wilayahList = useMemo(() => {
        const source = selectedGroup === 'ALL' 
          ? activeSourceData 
          : activeSourceData.filter(i => i.typeGroup === selectedGroup);
        return Array.from(new Set(source.map(item => item.wilayah))).filter(Boolean).sort();
      }, [activeSourceData, selectedGroup]);

      const unitList = useMemo(() => {
        let source = activeSourceData;
        if (selectedGroup !== 'ALL') source = source.filter(i => i.typeGroup === selectedGroup);
        if (selectedWilayah !== 'ALL') source = source.filter(i => i.wilayah === selectedWilayah);

        const setUnits = new Set();
        source.forEach(row => {
          const entit = (row.entitas || '').trim();
          let opUnit = (row.operatingUnit || '').trim().replace(/\s*-\s*/g, ' ');
          if (entit && opUnit) {
            setUnits.add(`[${entit}] ${opUnit}`);
          } else if (opUnit) {
            setUnits.add(opUnit);
          }
        });
        return Array.from(setUnits).sort();
      }, [activeSourceData, selectedGroup, selectedWilayah]);

      const kategoriList = useMemo(() => {
        return ["Bangunan Gedung", "Tanah", "Perabotan Otomasi", "Perabotan Non Otomasi", "Kendaraan"];
      }, []);

      const statusEnpList = useMemo(() => {
        const setEnp = new Set(rawData.map(i => i.statusEnp).filter(Boolean));
        return Array.from(setEnp).sort();
      }, [rawData]);

      const filteredData = useMemo(() => {
        return activeSourceData.filter(item => {
          const matchGroup = selectedGroup === 'ALL' || item.typeGroup === selectedGroup;
          const matchWilayah = selectedWilayah === 'ALL' || item.wilayah === selectedWilayah;
          
          let matchKategori = true;
          if (activeTab !== 'overview' && activeTab !== 'Perabotan Non Otomasi') {
            let cat = item.kategori || '';
            if (activeTab === 'Bangunan Gedung') matchKategori = cat.toLowerCase().includes('bangunan');
            else if (activeTab === 'Tanah') matchKategori = cat.toLowerCase().includes('tanah');
            else if (activeTab === 'Perabotan Otomasi') matchKategori = cat.toLowerCase().includes('otomasi') && !cat.toLowerCase().includes('non');
            else if (activeTab === 'Kendaraan') matchKategori = cat.toLowerCase().includes('kendaraan');
          }

          let matchUnit = true;
          if (selectedUnit !== 'ALL') {
            const entit = (item.entitas || '').trim();
            let opUnit = (item.operatingUnit || '').trim().replace(/\s*-\s*/g, ' ');
            const formatted = (entit && opUnit) ? `[${entit}] ${opUnit}` : opUnit;
            matchUnit = formatted === selectedUnit;
          }

          return matchGroup && matchWilayah && matchKategori && matchUnit;
        });
      }, [activeSourceData, selectedGroup, selectedWilayah, selectedUnit, activeTab]);

      const stats = useMemo(() => {
        let sumAlokasiAwal = 0;
        let sumAlokasiRevisiRbb = 0;
        let sumAlokasiEfs = 0;

        let totalRealisasi = 0;
        let totalProject = 0;
        let totalAktif = 0;
        let totalNonAktif = 0;

        const monthlyData = {};
        MONTHS.forEach(m => monthlyData[m.toLowerCase()] = 0);

        filteredData.forEach(row => {
          sumAlokasiAwal += Number(row.alokasiAwal) || 0;
          sumAlokasiRevisiRbb += Number(row.alokasiRevisiRbb) || 0;
          sumAlokasiEfs += Number(row.alokasiEfs) || 0;

          let rowRealisasi = 0;
          MONTHS.forEach(m => {
            const val = Number(row[m.toLowerCase()]) || 0;
            rowRealisasi += val;
            monthlyData[m.toLowerCase()] += val;
          });

          totalRealisasi += rowRealisasi;
          totalProject += 1;

          if (String(row.statusProject).toUpperCase() === 'NON AKTIF' || String(row.statusProject).toUpperCase() === 'DROPPED') {
            totalNonAktif += 1;
          } else {
            totalAktif += 1;
          }
        });

        const sisaBudget = Math.max(0, sumAlokasiEfs - totalRealisasi);
        const pctTotal = sumAlokasiEfs > 0 ? ((totalRealisasi / sumAlokasiEfs) * 100).toFixed(2) : '0.00';

        return { 
          sumAlokasiAwal, 
          sumAlokasiRevisiRbb, 
          sumAlokasiEfs, 
          totalRealisasi, 
          sisaBudget, 
          pctTotal, 
          totalProject, 
          totalAktif, 
          totalNonAktif, 
          monthlyData 
        };
      }, [filteredData]);

      const mappedProjectsData = useMemo(() => {
        return filteredData.map(row => {
          const aloEfs = Number(row.alokasiEfs) || 0;
          let totalReal = 0;
          MONTHS.forEach(m => { totalReal += Number(row[m.toLowerCase()]) || 0; });
          
          const pct = aloEfs > 0 ? (totalReal / aloEfs) * 100 : 0;
          return {
            ...row,
            totalReal,
            aloEfs,
            pctRealisasi: pct
          };
        });
      }, [filteredData]);

      const top10ProjectsList = useMemo(() => {
        let list = [...mappedProjectsData];
        if (topSearchTerm) {
          const term = topSearchTerm.toLowerCase();
          list = list.filter(p => 
            (p.namaProject || '').toLowerCase().includes(term) ||
            (p.projectNumber || '').toLowerCase().includes(term) ||
            (p.wilayah || '').toLowerCase().includes(term)
          );
        }

        return list.sort((a, b) => {
          if (b.pctRealisasi !== a.pctRealisasi) {
            return b.pctRealisasi - a.pctRealisasi;
          }
          return b.aloEfs - a.aloEfs;
        }).slice(0, 10);
      }, [mappedProjectsData, topSearchTerm]);

      const bottom10ProjectsList = useMemo(() => {
        let list = [...mappedProjectsData];
        if (bottomSearchTerm) {
          const term = bottomSearchTerm.toLowerCase();
          list = list.filter(p => 
            (p.namaProject || '').toLowerCase().includes(term) ||
            (p.projectNumber || '').toLowerCase().includes(term) ||
            (p.wilayah || '').toLowerCase().includes(term)
          );
        }

        return list.sort((a, b) => {
          if (a.pctRealisasi !== b.pctRealisasi) {
            return a.pctRealisasi - b.pctRealisasi;
          }
          return b.aloEfs - a.aloEfs;
        }).slice(0, 10);
      }, [mappedProjectsData, bottomSearchTerm]);

      const tickerStats = useMemo(() => {
        const totalAlokasiEfs = stats.sumAlokasiEfs;
        
        const currentMonthIdx = new Date().getMonth();
        const currentMonthName = MONTHS[currentMonthIdx];
        
        let totalKumulatifBulanBerjalan = 0;
        for (let i = 0; i <= currentMonthIdx; i++) {
          const mKey = MONTHS[i].toLowerCase();
          totalKumulatifBulanBerjalan += (stats.monthlyData[mKey] || 0);
        }

        const pctRealisasiTotal = stats.pctTotal;

        const mapWilayahPct = {};
        rawData.forEach(row => {
          const w = row.wilayah;
          if (w) {
            if (!mapWilayahPct[w]) mapWilayahPct[w] = { efs: 0, real: 0 };
            const efs = Number(row.alokasiEfs) || 0;
            let real = 0;
            MONTHS.forEach(m => { real += Number(row[m.toLowerCase()]) || 0; });

            mapWilayahPct[w].efs += efs;
            mapWilayahPct[w].real += real;
          }
        });

        const listWilayahPct = Object.keys(mapWilayahPct).map(w => {
          const efs = mapWilayahPct[w].efs;
          const real = mapWilayahPct[w].real;
          const pct = efs > 0 ? (real / efs) * 100 : 0;
          return { wilayah: w, pct };
        }).sort((a, b) => b.pct - a.pct);

        return {
          totalAlokasiEfs,
          currentMonthName,
          totalKumulatifBulanBerjalan,
          pctRealisasiTotal,
          listWilayahPct
        };
      }, [stats, rawData]);

      const categorySummaryBoxes = useMemo(() => {
        const targetCats = ["Bangunan Gedung", "Tanah", "Perabotan Otomasi", "Perabotan Non Otomasi", "Kendaraan"];
        const summary = {};

        targetCats.forEach(c => {
          summary[c] = { alokasi: 0, realisasi: 0, totalProject: 0, aktif: 0, nonAktif: 0 };
        });

        rawData.forEach(row => {
          let cat = row.kategori || '';
          let catKey = "Lainnya";

          if (cat.toLowerCase().includes('bangunan')) catKey = "Bangunan Gedung";
          else if (cat.toLowerCase().includes('tanah')) catKey = "Tanah";
          else if (cat.toLowerCase().includes('otomasi') && !cat.toLowerCase().includes('non')) catKey = "Perabotan Otomasi";
          else if (cat.toLowerCase().includes('perabotan')) catKey = "Perabotan Non Otomasi";
          else if (cat.toLowerCase().includes('kendaraan')) catKey = "Kendaraan";

          if (summary[catKey]) {
            const pagu = Number(row.alokasiEfs) || 0; 
            let rowReal = 0;
            MONTHS.forEach(m => { rowReal += Number(row[m.toLowerCase()]) || 0; });

            summary[catKey].alokasi += pagu;
            summary[catKey].realisasi += rowReal;
            summary[catKey].totalProject += 1;
            
            if (String(row.statusProject).toUpperCase() === 'NON AKTIF' || String(row.statusProject).toUpperCase() === 'DROPPED') {
              summary[catKey].nonAktif += 1;
            } else {
              summary[catKey].aktif += 1;
            }
          }
        });

        return summary;
      }, [rawData]);

      const mirrorChartData = useMemo(() => {
        const mapWilayah = {};

        rawData.forEach(row => {
          const w = row.wilayah || 'Lainnya';
          if (!mapWilayah[w]) mapWilayah[w] = { alokasi: 0, realisasi: 0, alokasiEfs: 0 };

          const paguAwal = Number(row.alokasiAwal) || 0;
          const paguEfs = Number(row.alokasiEfs) || 0;
          let rowReal = 0;
          MONTHS.forEach(m => { rowReal += Number(row[m.toLowerCase()]) || 0; });

          mapWilayah[w].alokasi += paguAwal;
          mapWilayah[w].alokasiEfs += paguEfs;
          mapWilayah[w].realisasi += rowReal;
        });

        const listSorted = Object.keys(mapWilayah)
          .map(w => {
            const aloAwal = mapWilayah[w].alokasi;
            const aloEfs = mapWilayah[w].alokasiEfs;
            const rea = mapWilayah[w].realisasi;
            const pct = aloEfs > 0 ? (rea / aloEfs) * 100 : 0; 
            return { name: w, alokasi: aloAwal, pctRealisasi: pct };
          })
          .sort((a, b) => b.alokasi - a.alokasi);

        return {
          labels: listSorted.map(item => item.name),
          alokasi: listSorted.map(item => item.alokasi),
          pctRealisasi: listSorted.map(item => item.pctRealisasi)
        };
      }, [rawData]);

      const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') {
          direction = 'desc';
        }
        setSortConfig({ key, direction });
      };

      const tableRows = useMemo(() => {
        let data = filteredData.filter(row => {
          if (tableSearchTerm) {
            const term = tableSearchTerm.toLowerCase();
            const matchName = (row.namaProject || '').toLowerCase().includes(term);
            const matchNum = (row.projectNumber || '').toLowerCase().includes(term);
            if (!matchName && !matchNum) return false;
          }

          if (tableWilayahFilter !== 'ALL') {
            if ((row.wilayah || '') !== tableWilayahFilter) return false;
          }

          if (tableKategoriFilter !== 'ALL') {
            let cat = (row.kategori || '').toLowerCase();
            if (tableKategoriFilter === 'Bangunan Gedung' && !cat.includes('bangunan')) return false;
            if (tableKategoriFilter === 'Tanah' && !cat.includes('tanah')) return false;
            if (tableKategoriFilter === 'Perabotan Otomasi' && (!cat.includes('otomasi') || cat.includes('non'))) return false;
            if (tableKategoriFilter === 'Perabotan Non Otomasi' && !cat.includes('non')) return false;
            if (tableKategoriFilter === 'Kendaraan' && !cat.includes('kendaraan')) return false;
          }

          if (tableStatusProjFilter !== 'ALL') {
            const stProj = (row.statusProject || '').toUpperCase();
            if (tableStatusProjFilter === 'AKTIF' && (stProj === 'NON AKTIF' || stProj === 'DROPPED')) return false;
            if (tableStatusProjFilter === 'NON_AKTIF' && (stProj !== 'NON AKTIF' && stProj !== 'DROPPED')) return false;
          }

          if (tableStatusEnpFilter !== 'ALL') {
            if ((row.statusEnp || '').toUpperCase() !== tableStatusEnpFilter.toUpperCase()) return false;
          }

          return true;
        });

        if (sortConfig.key !== null) {
          data.sort((a, b) => {
            let aVal, bVal;

            if (sortConfig.key === 'realisasi') {
              aVal = MONTHS.reduce((acc, m) => acc + (Number(a[m.toLowerCase()]) || 0), 0);
              bVal = MONTHS.reduce((acc, m) => acc + (Number(b[m.toLowerCase()]) || 0), 0);
            } else if (sortConfig.key === 'pctRealisasi') {
              const aReal = MONTHS.reduce((acc, m) => acc + (Number(a[m.toLowerCase()]) || 0), 0);
              const bReal = MONTHS.reduce((acc, m) => acc + (Number(b[m.toLowerCase()]) || 0), 0);
              const aEfs = Number(a.alokasiEfs) || 0;
              const bEfs = Number(b.alokasiEfs) || 0;
              aVal = aEfs > 0 ? (aReal / aEfs) * 100 : 0;
              bVal = bEfs > 0 ? (bReal / bEfs) * 100 : 0;
            } else {
              aVal = a[sortConfig.key];
              bVal = b[sortConfig.key];
            }

            if (aVal === undefined || aVal === null) aVal = '';
            if (bVal === undefined || bVal === null) bVal = '';

            if (typeof aVal === 'string') aVal = aVal.toLowerCase();
            if (typeof bVal === 'string') bVal = bVal.toLowerCase();

            if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
            if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }

        return data;
      }, [filteredData, tableSearchTerm, tableWilayahFilter, tableKategoriFilter, tableStatusProjFilter, tableStatusEnpFilter, sortConfig]);

      const resetTableFilters = () => {
        setTableSearchTerm('');
        setTableWilayahFilter('ALL');
        setTableKategoriFilter('ALL');
        setTableStatusProjFilter('ALL');
        setTableStatusEnpFilter('ALL');
        setSortConfig({ key: null, direction: 'asc' });
      };

      const totalPages = Math.max(1, Math.ceil(tableRows.length / itemsPerPage));
      
      const currentTableData = useMemo(() => {
        const startIdx = (currentPage - 1) * itemsPerPage;
        return tableRows.slice(startIdx, startIdx + itemsPerPage);
      }, [tableRows, currentPage, itemsPerPage]);

      const pageNumbers = useMemo(() => {
        const pages = [];
        if (totalPages <= 7) {
          for (let i = 1; i <= totalPages; i++) pages.push(i);
        } else {
          if (currentPage <= 4) {
            pages.push(1, 2, 3, 4, 5, '...', totalPages);
          } else if (currentPage >= totalPages - 3) {
            pages.push(1, '...', totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages);
          } else {
            pages.push(1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages);
          }
        }
        return pages;
      }, [currentPage, totalPages]);

      const totalColumns = activeTab === 'Perabotan Non Otomasi' ? 11 : 10;

      const renderSortIcon = (columnKey) => {
        if (sortConfig.key !== columnKey) {
          return <span className="ml-1 text-slate-300 hover:text-slate-500">↕</span>;
        }
        return sortConfig.direction === 'asc' 
          ? <span className="ml-1 text-bni-teal font-extrabold">▲</span> 
          : <span className="ml-1 text-bni-teal font-extrabold">▼</span>;
      };

      return (
        <div className="min-h-screen flex bg-[#F3F5F9] relative pb-16">
          
          {/* 1. LEFT SIDEBAR NAVIGATION */}
          <aside className="w-64 bg-white border-r border-slate-200/80 flex flex-col justify-between p-5 hidden lg:flex shrink-0">
            <div>
              <div className="flex items-center space-x-3 px-2 mb-8">
                <div className="bg-bni-orange text-white font-black px-2.5 py-1 rounded-lg text-lg tracking-wider shadow-sm">
                  BNI
                </div>
                <div>
                  <h1 className="font-bold text-slate-800 text-sm leading-none">PM-CAPEX</h1>
                  <span className="text-[10px] text-slate-400 font-medium">CAPEX Analytics 2026</span>
                </div>
              </div>

              <div className="space-y-6">
                <div>
                  <p className="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">General</p>
                  <nav className="space-y-1">
                    <button 
                      onClick={() => setActiveTab('overview')}
                      className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                        activeTab === 'overview' 
                          ? 'bg-bni-teal text-white shadow-sm' 
                          : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'
                      }`}
                    >
                      <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                      <span>Overview</span>
                    </button>

                    <div className="space-y-1">
                      <button 
                        onClick={() => setProjectsMenuOpen(!projectsMenuOpen)}
                        className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                          activeTab !== 'overview' 
                            ? 'bg-bni-teal/10 text-bni-teal font-bold' 
                            : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'
                        }`}
                      >
                        <div className="flex items-center space-x-3">
                          <i data-lucide="folder-kanban" className="w-4 h-4"></i>
                          <span>Projects</span>
                        </div>
                        <i data-lucide={projectsMenuOpen ? "chevron-down" : "chevron-right"} className="w-3.5 h-3.5 text-slate-400"></i>
                      </button>

                      {projectsMenuOpen && (
                        <div className="pl-6 space-y-1 pt-1 border-l-2 border-slate-100 ml-4">
                          {kategoriList.map(cat => (
                            <button
                              key={cat}
                              onClick={() => setActiveTab(cat)}
                              className={`w-full text-left px-3 py-1.5 rounded-lg text-[11px] font-semibold transition-all flex items-center space-x-2 ${
                                activeTab === cat
                                  ? 'bg-bni-orange text-white font-bold shadow-sm'
                                  : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'
                              }`}
                            >
                              <span className={`w-1.5 h-1.5 rounded-full ${activeTab === cat ? 'bg-white' : 'bg-slate-300'}`}></span>
                              <span className="truncate">{cat}</span>
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </nav>
                </div>
              </div>
            </div>

            <div className="pt-4 border-t border-slate-100 flex items-center space-x-3 px-2">
              <div className="w-9 h-9 rounded-full bg-bni-teal-subtle text-bni-teal font-bold flex items-center justify-center text-xs">
                NOS
              </div>
              <div className="overflow-hidden">
                <p className="text-xs font-bold text-slate-800 truncate">NOS-Dept.</p>
                <p className="text-[10px] text-slate-400 truncate">Internal Facilities Management Teams</p>
              </div>
            </div>
          </aside>

          {/* 2. MAIN DASHBOARD CONTENT */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            <header className="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200/80 px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 className="text-base font-extrabold text-slate-800">CAPEX Divisi NSD & Wilayah-Cabang</h2>

              <div className="flex flex-wrap items-center gap-2">

                      setSelectedWilayah('ALL');
                      setSelectedUnit('ALL');
                    }}
                    className="bg-transparent text-slate-700 font-extrabold text-xs border-none focus:outline-none cursor-pointer"
                  >

                  <select 
                    value={selectedWilayah} 
                    onChange={(e) => {
                      setSelectedWilayah(e.target.value);
                      setSelectedUnit('ALL');
                    }}
                    className="bg-transparent text-slate-700 font-bold text-xs border-none focus:outline-none cursor-pointer max-w-[120px] truncate"
                  >
                    <option value="ALL">Semua Unit Kerja</option>
                    {wilayahList.map(w => (
                      <option key={w} value={w}>{w}</option>
                    ))}
                  </select>
                </div>

                <div className="flex items-center bg-slate-100 border border-slate-200/80 rounded-xl px-2.5 py-1.5">
                  <i data-lucide="building" className="w-3.5 h-3.5 text-slate-500 mr-1.5"></i>
                  <select

                  >

            </header>

            <div className="p-6 space-y-6 max-w-7xl w-full mx-auto">
              
              <div className="flex items-center justify-between">
                <div>
                  <div className="flex items-center space-x-2 text-xs text-slate-400 font-medium mb-1">
                    <span>General</span>
                    <i data-lucide="chevron-right" className="w-3 h-3"></i>
                    <span className="text-bni-teal font-bold capitalize">{activeTab === 'overview' ? 'Overview' : `Projects / ${activeTab}`}</span>

                  </p>

              </div>

              {/* SUMMARY CARDS */}
              <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                <div className="flex items-center justify-between border-b pb-2 border-slate-100">
                  <h4 className="font-extrabold text-slate-800 text-sm flex items-center space-x-2">
                    <i data-lucide="layers" className="w-4 h-4 text-bni-teal"></i>
                    <span>Ringkasan Alokasi Anggaran (3 Versi)</span>
                  </h4>
                  <span className="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">Total Alokasi</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-teal-50/50 border border-teal-100 p-4 rounded-xl">
                    <span className="text-[10px] font-bold text-teal-700 uppercase">a. Usul Alokasi Awal</span>
                    <h4 className="text-xl font-black text-slate-800 mt-1">{formatCompactIDR(stats.sumAlokasiAwal)}</h4>
                    <p className="text-[10px] text-slate-400 mt-1">{formatIDR(stats.sumAlokasiAwal)}</p>

                  <div className="bg-amber-50/50 border border-amber-100 p-4 rounded-xl">
                    <span className="text-[10px] font-bold text-amber-700 uppercase">b. Usul Alokasi Revisi RBB</span>
                    <h4 className="text-xl font-black text-slate-800 mt-1">{formatCompactIDR(stats.sumAlokasiRevisiRbb)}</h4>
                    <p className="text-[10px] text-slate-400 mt-1">{formatIDR(stats.sumAlokasiRevisiRbb)}</p>

                        {/* 1. TOTAL ALOKASI EFS */}
                        <div className="flex items-center space-x-2 bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg">
                          <span className="text-slate-400 text-[10px] uppercase font-bold">Total Alokasi EFS:</span>
                          <span className="font-extrabold text-blue-400 text-xs">{formatCompactIDR(tickerStats.totalAlokasiEfs)}</span>
                        </div>

                        {/* 2. REALISASI KUMULATIF JAN S.D BULAN BERJALAN */}
                        <div className="flex items-center space-x-2 bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg">
                          <span className="text-slate-400 text-[10px] uppercase font-bold">Realisasi (Jan - {tickerStats.currentMonthName}):</span>
                          <span className="font-extrabold text-amber-400 text-xs">{formatCompactIDR(tickerStats.totalKumulatifBulanBerjalan)}</span>
                        </div>

                        {/* 3. % REALISASI TOTAL */}
                        <div className="flex items-center space-x-2 bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg">
                          <span className="text-slate-400 text-[10px] uppercase font-bold">% Realisasi Total:</span>
                          <span className="font-extrabold text-emerald-400 text-xs">{tickerStats.pctRealisasiTotal}%</span>
                        </div>

                        <span className="text-slate-700 font-black">|</span>

                        {/* 4. PENYERAPAN PER WILAYAH */}
                        <div className="flex items-center space-x-3">
                          <span className="font-extrabold text-bni-orange uppercase tracking-wider text-[11px] flex items-center space-x-1">
                            <span>📍 Realisasi Per Wilayah:</span>
                          </span>
                          {tickerStats.listWilayahPct.map((item, idx) => (
                            <span key={`wil-${idx}`} className="inline-flex items-center space-x-1.5 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg">
                              <span className="font-bold text-slate-300 text-[11px]">{item.wilayah}:</span>
                              <span className={`font-black text-[11px] ${
                                item.pct >= 85 ? 'text-emerald-400' :
                                item.pct >= 50 ? 'text-amber-400' : 'text-rose-400'
                              }`}>
                                {item.pct.toFixed(2)}%
                              </span>
                            </span>
                          ))}
                        </div>

                        <span className="text-slate-700 font-black">|</span>

                        {/* 5. TOP 10 PROJECT HIGH PERFORMANCE */}
                        <div className="flex items-center space-x-3">
                          <span className="font-extrabold text-emerald-400 uppercase tracking-wider text-[11px] flex items-center space-x-1">
                            <span>🔥 Top 10 High Performance:</span>
                          </span>
                          {top10ProjectsList.map((proj, idx) => (
                            <span key={`top-tick-${idx}`} className="inline-flex items-center space-x-1.5 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg">
                              <span className="text-slate-400 font-bold text-[10px]">#{idx + 1}</span>
                              <span className="font-bold text-slate-200 max-w-[130px] truncate" title={proj.namaProject}>
                                [{proj.projectNumber || 'PROJ'}] {proj.namaProject}
                              </span>
                              <span className="text-emerald-400 font-black text-[11px] bg-emerald-950 px-1.5 py-0.5 rounded border border-emerald-800/50">
                                {proj.pctRealisasi.toFixed(2)}%
                              </span>
                            </span>
                          ))}
                        </div>

                        <span className="text-slate-700 font-black">|</span>

                        {/* 6. BOTTOM 10 PROJECT NEED ATTENTION */}
                        <div className="flex items-center space-x-3">
                          <span className="font-extrabold text-rose-400 uppercase tracking-wider text-[11px] flex items-center space-x-1">
                            <span>⚠️ Bottom 10 Need Attention:</span>
                          </span>
                          {bottom10ProjectsList.map((proj, idx) => (
                            <span key={`bot-tick-${idx}`} className="inline-flex items-center space-x-1.5 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg">
                              <span className="text-slate-400 font-bold text-[10px]">#{idx + 1}</span>
                              <span className="font-bold text-slate-200 max-w-[130px] truncate" title={proj.namaProject}>
                                [{proj.projectNumber || 'PROJ'}] {proj.namaProject}
                              </span>
                              <span className="text-rose-400 font-black text-[11px] bg-rose-950 px-1.5 py-0.5 rounded border border-rose-800/50">
                                {proj.pctRealisasi.toFixed(2)}%
                              </span>
                              <span className="text-[10px] text-slate-500 font-mono">
                                ({formatCompactIDR(proj.aloEfs)})
                              </span>
                            </span>
                          ))}
                        </div>

                        <span className="text-slate-700 font-black">|</span>
                      </>
                    );

                    return (
                      <>
                        {renderTickerContent()}
                        {renderTickerContent()}
                      </>
                    );
                  })()}
                </div>
              </div>
            </div>

            <div className="bg-slate-900 px-4 py-2 border-t md:border-t-0 md:border-l border-slate-800 shrink-0 text-slate-400 text-[11px] font-medium text-center">
              Copyright © 2026 by <b className="text-slate-200 font-extrabold">Fajar Ramadhan - P052099</b> | Divisi NSD
            </div>

          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
