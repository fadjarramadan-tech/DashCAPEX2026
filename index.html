<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Realisasi Anggaran Investasi - BNI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- SheetJS (XLSX) untuk Export Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- jsPDF & AutoTable untuk Export PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bni: {
              teal: '#006666',
              'teal-dark': '#004d4d',
              'teal-subtle': '#EAF4F4',
              orange: '#F15A24',
              'orange-dark': '#D14817',
              'orange-subtle': '#FFF2EE',
              bg: '#F3F5F9'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F3F5F9; color: #1E293B; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: max-content;
      animation: marquee 85s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="antialiased selection:bg-bni-teal selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxf89NXCAtrjZn3bFdhtO45DfikiDn8SiYavFBDerqyzIBeUt8yiKAxXoSwOu24N9z-mA/exec";
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];

    const formatIDR = (val) => {
      if (val === undefined || val === null || isNaN(val)) return 'Rp 0,00';
      return new Intl.NumberFormat('id-ID', { 
        style: 'currency', 
        currency: 'IDR', 
        minimumFractionDigits: 2,
        maximumFractionDigits: 2 
      }).format(val);
    };

    const formatSlimIDR = (val) => {
      if (!val || isNaN(val) || Number(val) === 0) return <span className="text-slate-300 font-normal">-</span>;
      const num = Number(val);
      if (Math.abs(num) >= 1e9) {
        return `Rp ${(num / 1e9).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} M`;
      }
      if (Math.abs(num) >= 1e6) {
        return `Rp ${(num / 1e6).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Jt`;
      }
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
    };

    const formatNumberInput = (val) => {
      if (!val && val !== 0) return '';
      const cleanNum = String(val).replace(/\D/g, '');
      if (!cleanNum) return '';
      return new Intl.NumberFormat('id-ID').format(cleanNum);
    };

    const formatCompactIDR = (val) => {
      if (!val) return 'Rp 0,00';
      if (val >= 1e12) return `Rp ${(val / 1e12).toFixed(2)} T`;
      if (val >= 1e9) return `Rp ${(val / 1e9).toFixed(2)} M`;
      if (val >= 1e6) return `Rp ${(val / 1e6).toFixed(2)} Jt`;
      return formatIDR(val);
    };

    const MiniSparkBar = ({ color = "teal" }) => {
      const bars = [35, 55, 40, 70, 60, 95];
      return (
        <div className="flex items-end space-x-1.5 h-12">
          {bars.map((height, idx) => (
            <div 
              key={idx} 
              style={{ height: `${height}%` }} 
              className={`w-2 rounded-t-sm transition-all duration-300 ${
                idx === bars.length - 1 
                  ? (color === "orange" ? "bg-bni-orange" : "bg-bni-teal") 
                  : (color === "orange" ? "bg-orange-200" : "bg-teal-200")
              }`}
            ></div>
          ))}
        </div>
      );
    };

    const HeatmapMatrix = ({ data, categories, wilayahs, type = 'efs', reportMonth = 'Des' }) => {
      const { matrixData, colTotals, rowTotals, grandTotal } = useMemo(() => {
        const matrix = {};
        const colTot = {};
        const rowTot = {};
        
        categories.forEach(c => {
          colTot[c] = { alokasiEfs: 0, realisasi: 0 };
        });

        wilayahs.forEach(w => {
          matrix[w] = {};
          rowTot[w] = { alokasiEfs: 0, realisasi: 0 };
          categories.forEach(c => {
            matrix[w][c] = { alokasiEfs: 0, realisasi: 0 };
          });
        });

        let grandTot = { alokasiEfs: 0, realisasi: 0 };

        data.forEach(row => {
          const w = row.wilayah;
          let cat = row.kategori || '';
          let matchedCat = null;

          if (cat.toLowerCase().includes('bangunan')) matchedCat = "Bangunan Gedung";
          else if (cat.toLowerCase().includes('tanah')) matchedCat = "Tanah";
          else if (cat.toLowerCase().includes('otomasi') && !cat.toLowerCase().includes('non')) matchedCat = "Perabotan Otomasi";
          else if (cat.toLowerCase().includes('perabotan')) matchedCat = "Perabotan Non Otomasi";
          else if (cat.toLowerCase().includes('kendaraan')) matchedCat = "Kendaraan";

          if (w && matchedCat && matrix[w] && matrix[w][matchedCat]) {
            const mKey = reportMonth.toLowerCase();
            const efs = Number(row[`efs_${mKey}`]) !== undefined ? Number(row[`efs_${mKey}`]) : (Number(row.alokasiEfs) || 0);
            
            const targetMonthIdx = MONTHS.indexOf(reportMonth);
            let kumulatifReal = 0;
            for (let i = 0; i <= targetMonthIdx; i++) {
              kumulatifReal += Number(row[MONTHS[i].toLowerCase()]) || 0;
            }
            const valMonthVal = Number(row[mKey]) || 0;
            const real = valMonthVal > kumulatifReal ? valMonthVal : kumulatifReal;

            matrix[w][matchedCat].alokasiEfs += efs;
            matrix[w][matchedCat].realisasi += real;

            rowTot[w].alokasiEfs += efs;
            rowTot[w].realisasi += real;

            colTot[matchedCat].alokasiEfs += efs;
            colTot[matchedCat].realisasi += real;

            grandTot.alokasiEfs += efs;
            grandTot.realisasi += real;
          }
        });

        return { 
          matrixData: matrix, 
          colTotals: colTot, 
          rowTotals: rowTot, 
          grandTotal: grandTot 
        };
      }, [data, categories, wilayahs, reportMonth]);

      const getBgStylePct = (pct) => {
        if (pct === 0) return { backgroundColor: '#F8FAFC', color: '#94A3B8' };
        if (pct >= 85) return { backgroundColor: '#10B981', color: '#FFFFFF' };
        if (pct >= 60) return { backgroundColor: '#34D399', color: '#065F46' };
        if (pct >= 30) return { backgroundColor: '#FBBF24', color: '#78350F' };
        return { backgroundColor: '#FFEDD5', color: '#C2410C' };
      };

      const getBgStyleEfs = (val, maxVal) => {
        if (val === 0) return { backgroundColor: '#F8FAFC', color: '#94A3B8' };
        const ratio = maxVal > 0 ? val / maxVal : 0;
        if (ratio >= 0.7) return { backgroundColor: '#006666', color: '#FFFFFF' };
        if (ratio >= 0.4) return { backgroundColor: '#0D9488', color: '#FFFFFF' };
        if (ratio >= 0.15) return { backgroundColor: '#99F6E4', color: '#134E4A' };
        return { backgroundColor: '#E0F2FE', color: '#0369A1' };
      };

      const maxEfsVal = useMemo(() => {
        let max = 0;
        wilayahs.forEach(w => {
          categories.forEach(c => {
            if (matrixData[w] && matrixData[w][c]) {
              if (matrixData[w][c].alokasiEfs > max) max = matrixData[w][c].alokasiEfs;
            }
          });
        });
        return max;
      }, [matrixData, wilayahs, categories]);

      const grandPct = grandTotal.alokasiEfs > 0 
        ? (grandTotal.realisasi / grandTotal.alokasiEfs) * 100 
        : 0;

      return (
        <div className="w-full overflow-hidden">
          <table className="w-full text-center border-collapse table-fixed">
            <thead>
              <tr>
                <th className="p-1.5 text-[9px] font-extrabold text-slate-400 bg-slate-50 border border-slate-200 text-left w-[18%]">Wilayah</th>
                {categories.map(c => (
                  <th key={c} className="p-1 text-[8px] font-extrabold text-slate-600 bg-slate-50 border border-slate-200 leading-tight">
                    {c}
                  </th>
                ))}
                <th className="p-1 text-[8px] font-black text-slate-800 bg-slate-200 border border-slate-300 w-[15%]">
                  Total
                </th>
              </tr>
            </thead>
            <tbody>
              {wilayahs.map(w => {
                const rowItem = rowTotals[w] || { alokasiEfs: 0, realisasi: 0 };
                const rowPct = rowItem.alokasiEfs > 0 ? (rowItem.realisasi / rowItem.alokasiEfs) * 100 : 0;

                return (
                  <tr key={w}>
                    <td className="p-1 text-[9px] font-bold text-slate-700 bg-slate-50 border border-slate-200 text-left truncate" title={w}>
                      {w}
                    </td>
                    {categories.map(c => {
                      const item = matrixData[w] ? matrixData[w][c] : { alokasiEfs: 0, realisasi: 0 };
                      const pct = item.alokasiEfs > 0 ? (item.realisasi / item.alokasiEfs) * 100 : 0;
                      
                      const style = type === 'pct' 
                        ? getBgStylePct(pct) 
                        : getBgStyleEfs(item.alokasiEfs, maxEfsVal);

                      return (
                        <td 
                          key={c} 
                          style={style} 
                          className="p-1 border border-slate-200 text-[8px] font-extrabold transition-all hover:scale-105 cursor-default truncate"
                          title={`${w} - ${c}\nAlokasi EFS: ${formatIDR(item.alokasiEfs)}\nRealisasi: ${formatIDR(item.realisasi)}\n% Realisasi: ${pct.toFixed(2)}%`}
                        >
                          {type === 'pct' ? (
                            item.alokasiEfs > 0 ? `${pct.toFixed(2)}%` : '-'
                          ) : (
                            item.alokasiEfs > 0 ? formatCompactIDR(item.alokasiEfs) : '-'
                          )}
                        </td>
                      );
                    })}

                    <td 
                      className="p-1 border border-slate-300 bg-slate-100 text-slate-800 text-[8px] font-black cursor-default truncate"
                      title={`Total ${w}\nAlokasi EFS: ${formatIDR(rowItem.alokasiEfs)}\nRealisasi: ${formatIDR(rowItem.realisasi)}\n% Realisasi: ${rowPct.toFixed(2)}%`}
                    >
                      {type === 'pct' ? (
                        rowItem.alokasiEfs > 0 ? `${rowPct.toFixed(2)}%` : '-'
                      ) : (
                        rowItem.alokasiEfs > 0 ? formatCompactIDR(rowItem.alokasiEfs) : '-'
                      )}
                    </td>
                  </tr>
                );
              })}

              <tr className="border-t-2 border-slate-400">
                <td className="p-1 text-[9px] font-black text-slate-800 bg-slate-200 border border-slate-300 text-left truncate">
                  Total
                </td>
                {categories.map(c => {
                  const colItem = colTotals[c] || { alokasiEfs: 0, realisasi: 0 };
                  const colPct = colItem.alokasiEfs > 0 ? (colItem.realisasi / colItem.alokasiEfs) * 100 : 0;

                  return (
                    <td 
                      key={`tot-${c}`} 
                      className="p-1 border border-slate-300 bg-slate-100 text-slate-800 text-[8px] font-black cursor-default truncate"
                      title={`Total Kategori ${c}\nAlokasi EFS: ${formatIDR(colItem.alokasiEfs)}\nRealisasi: ${formatIDR(colItem.realisasi)}\n% Realisasi: ${colPct.toFixed(2)}%`}
                    >
                      {type === 'pct' ? (
                        colItem.alokasiEfs > 0 ? `${colPct.toFixed(2)}%` : '-'
                      ) : (
                        colItem.alokasiEfs > 0 ? formatCompactIDR(colItem.alokasiEfs) : '-'
                      )}
                    </td>
                  );
                })}

                <td 
                  className="p-1 border border-slate-400 bg-slate-300 text-slate-900 text-[8px] font-black cursor-default truncate"
                  title={`GRAND TOTAL\nAlokasi EFS: ${formatIDR(grandTotal.alokasiEfs)}\nRealisasi: ${formatIDR(grandTotal.realisasi)}\n% Realisasi: ${grandPct.toFixed(2)}%`}
                >
                  {type === 'pct' ? (
                    grandTotal.alokasiEfs > 0 ? `${grandPct.toFixed(2)}%` : '-'
                  ) : (
                    grandTotal.alokasiEfs > 0 ? formatCompactIDR(grandTotal.alokasiEfs) : '-'
                  )}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      );
    };

    const MirrorHorizontalBarChart = ({ labels, alokasiData, pctRealisasiData }) => {
      const canvasLeftRef = useRef(null);
      const canvasRightRef = useRef(null);
      const chartLeftRef = useRef(null);
      const chartRightRef = useRef(null);

      useEffect(() => {
        if (!canvasLeftRef.current || !canvasRightRef.current) return;

        const ctxLeft = canvasLeftRef.current.getContext('2d');
        if (chartLeftRef.current) chartLeftRef.current.destroy();

        chartLeftRef.current = new Chart(ctxLeft, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Total Alokasi',
              data: alokasiData,
              backgroundColor: '#006666',
              borderRadius: 4
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (ctx) => ` Alokasi: ${formatIDR(ctx.raw)}` } }
            },
            scales: {
              x: {
                reverse: true,
                ticks: {
                  callback: (val) => val >= 1e9 ? `${(val/1e9).toFixed(0)}M` : val >= 1e6 ? `${(val/1e6).toFixed(0)}Jt` : val,
                  font: { size: 9 }
                },
                grid: { color: '#EDF2F7' }
              },
              y: {
                position: 'right',
                ticks: { font: { size: 10, weight: 'bold' } },
                grid: { display: false }
              }
            }
          }
        });

        const ctxRight = canvasRightRef.current.getContext('2d');
        if (chartRightRef.current) chartRightRef.current.destroy();

        chartRightRef.current = new Chart(ctxRight, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: '% Realisasi',
              data: pctRealisasiData,
              backgroundColor: '#F15A24',
              borderRadius: 4
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (ctx) => ` Penyerapan Realisasi: ${ctx.raw.toFixed(2)}%` } }
            },
            scales: {
              x: {
                ticks: {
                  callback: (val) => `${val}%`,
                  font: { size: 9 }
                },
                grid: { color: '#EDF2F7' }
              },
              y: {
                position: 'left',
                ticks: { font: { size: 10, weight: 'bold' } },
                grid: { display: false }
              }
            }
          }
        });

        return () => {
          if (chartLeftRef.current) chartLeftRef.current.destroy();
          if (chartRightRef.current) chartRightRef.current.destroy();
        };
      }, [labels, alokasiData, pctRealisasiData]);

      return (
        <div className="grid grid-cols-2 gap-2 h-72">
          <div className="flex flex-col h-full">
            <div className="flex items-center justify-between pb-1 border-b mb-2 border-slate-100">
              <span className="text-xs font-extrabold text-bni-teal flex items-center space-x-1">
                <i data-lucide="bar-chart-2" className="w-3.5 h-3.5"></i>
                <span>Alokasi (EFS)</span>
              </span>
              <span className="text-[9px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">Mirror Left</span>
            </div>
            <div className="flex-1 w-full relative">
              <canvas ref={canvasLeftRef}></canvas>
            </div>
          </div>

          <div className="flex flex-col h-full">
            <div className="flex items-center justify-between pb-1 border-b mb-2 border-slate-100">
              <span className="text-xs font-extrabold text-bni-orange flex items-center space-x-1">
                <i data-lucide="percent" className="w-3.5 h-3.5"></i>
                <span>% Realisasi (vs Alokasi)</span>
              </span>
              <span className="text-[9px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">Mirror Right</span>
            </div>
            <div className="flex-1 w-full relative">
              <canvas ref={canvasRightRef}></canvas>
            </div>
          </div>
        </div>
      );
    };

    const HalfGaugeChart = ({ percentage, totalRealisasi, totalAlokasi }) => {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');
        if (chartRef.current) chartRef.current.destroy();

        const pctVal = Math.min(100, Math.max(0, Number(percentage) || 0));
        const remainingVal = Math.max(0, 100 - pctVal);

        chartRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Realisasi (%)', 'Sisa Anggaran (%)'],
            datasets: [{
              data: [pctVal, remainingVal],
              backgroundColor: ['#F15A24', '#E2E8F0'],
              borderWidth: 0,
              circumference: 180,
              rotation: 270
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '75%',
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${ctx.raw.toFixed(2)}%` } }
            }
          }
        });

        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [percentage]);

      return (
        <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between space-y-2">
          <div className="flex items-center justify-between border-b pb-2 border-slate-100">
            <h4 className="font-extrabold text-slate-800 text-sm flex items-center space-x-2">
              <i data-lucide="pie-chart" className="w-4 h-4 text-bni-orange"></i>
              <span>% Penyerapan Realisasi</span>
            </h4>
            <span className="text-[10px] font-bold text-bni-teal bg-bni-teal-subtle px-2 py-0.5 rounded-full">KPI Gauge</span>
          </div>

          <div className="relative h-48 w-full flex items-center justify-center">
            <canvas ref={canvasRef}></canvas>
            
            <div className="absolute bottom-6 flex flex-col items-center justify-center text-center">
              <span className="text-3xl font-black text-slate-800 tracking-tight">{percentage}%</span>
              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Penyerapan</span>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-2 text-center border-t pt-2.5 border-slate-100">
            <div className="bg-slate-50 p-2 rounded-xl border border-slate-100">
              <span className="text-[9px] font-bold text-slate-400 uppercase block">Alokasi EFS</span>
              <span className="font-black text-bni-teal text-xs">{formatCompactIDR(totalAlokasi)}</span>
            </div>
            <div className="bg-slate-50 p-2 rounded-xl border border-slate-100">
              <span className="text-[9px] font-bold text-slate-400 uppercase block">Realisasi</span>
              <span className="font-black text-bni-orange text-xs">{formatCompactIDR(totalRealisasi)}</span>
            </div>
          </div>
        </div>
      );
    };

    // KOMPONEN HISTORICAL ANALYSIS VIEW (DIPERBAIKI UNTUK KALKULASI KUMULATIF)
    const HistoricalAnalysisView = ({ data }) => {
      const [m1, setM1] = useState('Jun');
      const [m2, setM2] = useState('Jul');
      const [searchQuery, setSearchQuery] = useState('');
      const [diffFilter, setDynamicDiffFilter] = useState('ALL');
      const [histSortConfig, setHistSortConfig] = useState({ key: null, direction: 'asc' });
      
      const canvasHistRef = useRef(null);
      const chartHistRef = useRef(null);

      // Monthly Kumulatif Aggregates
      const monthlySummary = useMemo(() => {
        const result = MONTHS.map((m, mIdx) => {
          const key = m.toLowerCase();
          let efsTot = 0;
          let realTot = 0;

          data.forEach(item => {
            efsTot += Number(item[`efs_${key}`]) !== undefined ? Number(item[`efs_${key}`]) : (Number(item.alokasiEfs) || 0);
            
            // Hitung kumulatif Jan s/d Bulan m
            let kumulatifRowReal = 0;
            for (let i = 0; i <= mIdx; i++) {
              kumulatifRowReal += Number(item[MONTHS[i].toLowerCase()]) || 0;
            }
            const valMonthVal = Number(item[key]) || 0;
            realTot += (valMonthVal > kumulatifRowReal ? valMonthVal : kumulatifRowReal);
          });

          const pct = efsTot > 0 ? (realTot / efsTot) * 100 : 0;
          return { month: m, alokasi: efsTot, realisasi: realTot, pct };
        });

        return result;
      }, [data]);

      useEffect(() => {
        if (!canvasHistRef.current) return;
        const ctx = canvasHistRef.current.getContext('2d');
        if (chartHistRef.current) chartHistRef.current.destroy();

        chartHistRef.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: monthlySummary.map(d => d.month),
            datasets: [
              {
                type: 'line',
                label: '% Realisasi vs EFS',
                data: monthlySummary.map(d => d.pct),
                borderColor: '#F15A24',
                backgroundColor: '#F15A24',
                borderWidth: 3,
                yAxisID: 'y1',
                tension: 0.3
              },
              {
                type: 'bar',
                label: 'Alokasi EFS Bulanan',
                data: monthlySummary.map(d => d.alokasi),
                backgroundColor: '#006666',
                borderRadius: 4,
                yAxisID: 'y'
              },
              {
                type: 'bar',
                label: 'Realisasi Kumulatif Bulanan',
                data: monthlySummary.map(d => d.realisasi),
                backgroundColor: '#0D9488',
                borderRadius: 4,
                yAxisID: 'y'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
              y: {
                type: 'linear',
                display: true,
                position: 'left',
                ticks: {
                  callback: (val) => val >= 1e9 ? `${(val/1e9).toFixed(1)}M` : val >= 1e6 ? `${(val/1e6).toFixed(0)}Jt` : val
                },
                grid: { color: '#F1F5F9' }
              },
              y1: {
                type: 'linear',
                display: true,
                position: 'right',
                ticks: { callback: (val) => `${val.toFixed(0)}%` },
                grid: { drawOnChartArea: false }
              }
            }
          }
        });

        return () => { if (chartHistRef.current) chartHistRef.current.destroy(); };
      }, [monthlySummary]);

      const handleHistSort = (key) => {
        let direction = 'asc';
        if (histSortConfig.key === key && histSortConfig.direction === 'asc') {
          direction = 'desc';
        }
        setHistSortConfig({ key, direction });
      };

      const renderHistSortIcon = (columnKey) => {
        if (histSortConfig.key !== columnKey) {
          return <span className="ml-1 text-slate-300 hover:text-slate-500">↕</span>;
        }
        return histSortConfig.direction === 'asc' 
          ? <span className="ml-1 text-bni-teal font-extrabold">▲</span> 
          : <span className="ml-1 text-bni-teal font-extrabold">▼</span>;
      };

      // Projects Variance comparison M1 vs M2 dengan kalkulasi kumulatif
      const varianceData = useMemo(() => {
        const idx1 = MONTHS.indexOf(m1);
        const idx2 = MONTHS.indexOf(m2);

        const k1 = m1.toLowerCase();
        const k2 = m2.toLowerCase();

        let list = data.map(item => {
          const efs1 = Number(item[`efs_${k1}`]) !== undefined ? Number(item[`efs_${k1}`]) : (Number(item.alokasiEfs) || 0);
          const efs2 = Number(item[`efs_${k2}`]) !== undefined ? Number(item[`efs_${k2}`]) : (Number(item.alokasiEfs) || 0);
          const diffEfs = efs2 - efs1;

          // Realisasi Kumulatif M1
          let kumulatifReal1 = 0;
          for (let i = 0; i <= idx1; i++) {
            kumulatifReal1 += Number(item[MONTHS[i].toLowerCase()]) || 0;
          }
          const val1 = Number(item[k1]) || 0;
          const real1 = val1 > kumulatifReal1 ? val1 : kumulatifReal1;

          // Realisasi Kumulatif M2
          let kumulatifReal2 = 0;
          for (let i = 0; i <= idx2; i++) {
            kumulatifReal2 += Number(item[MONTHS[i].toLowerCase()]) || 0;
          }
          const val2 = Number(item[k2]) || 0;
          const real2 = val2 > kumulatifReal2 ? val2 : kumulatifReal2;

          const diffReal = real2 - real1;

          return {
            ...item,
            efs1,
            efs2,
            diffEfs,
            real1,
            real2,
            diffReal
          };
        });

        list = list.filter(item => {
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const matchName = (item.namaProject || '').toLowerCase().includes(q);
            const matchNum = (item.projectNumber || '').toLowerCase().includes(q);
            const matchWil = (item.wilayah || '').toLowerCase().includes(q);
            if (!matchName && !matchNum && !matchWil) return false;
          }

          if (diffFilter === 'CHANGED') return item.diffEfs !== 0 || item.diffReal !== 0;
          if (diffFilter === 'INCREASED') return item.diffEfs > 0;
          if (diffFilter === 'DECREASED') return item.diffEfs < 0;

          return true;
        });

        if (histSortConfig.key !== null) {
          list.sort((a, b) => {
            let aVal = a[histSortConfig.key];
            let bVal = b[histSortConfig.key];

            if (aVal === undefined || aVal === null) aVal = '';
            if (bVal === undefined || bVal === null) bVal = '';

            if (typeof aVal === 'string') aVal = aVal.toLowerCase();
            if (typeof bVal === 'string') bVal = bVal.toLowerCase();

            if (aVal < bVal) return histSortConfig.direction === 'asc' ? -1 : 1;
            if (aVal > bVal) return histSortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }

        return list;
      }, [data, m1, m2, searchQuery, diffFilter, histSortConfig]);

      const varianceStats = useMemo(() => {
        let totEfs1 = 0, totEfs2 = 0, totReal1 = 0, totReal2 = 0;
        let changedCount = 0;

        varianceData.forEach(i => {
          totEfs1 += i.efs1;
          totEfs2 += i.efs2;
          totReal1 += i.real1;
          totReal2 += i.real2;
          if (i.diffEfs !== 0) changedCount++;
        });

        return {
          totEfs1, totEfs2, diffEfs: totEfs2 - totEfs1,
          totReal1, totReal2, diffReal: totReal2 - totReal1,
          changedCount
        };
      }, [varianceData]);

      const exportHistToExcel = () => {
        const rows = varianceData.map((row, index) => ({
          "No": index + 1,
          "Project Number": row.projectNumber || '-',
          "Nama Project": row.namaProject || '-',
          "Wilayah": row.wilayah || '-',
          "Operating Unit": row.operatingUnit || '-',
          [`Alokasi EFS (${m1})`]: row.efs1,
          [`Alokasi EFS (${m2})`]: row.efs2,
          "Selisih EFS": row.diffEfs,
          [`Realisasi (${m1})`]: row.real1,
          [`Realisasi (${m2})`]: row.real2,
          "Selisih Realisasi": row.diffReal
        }));

        const worksheet = XLSX.utils.json_to_sheet(rows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Historical_Variance");
        XLSX.writeFile(workbook, `Report_Historical_Variance_${m1}_vs_${m2}.xlsx`);
      };

      const exportHistToPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');

        doc.setFontSize(14);
        doc.text(`Laporan Historical & Variance Analysis (${m1} vs ${m2})`, 14, 15);
        doc.setFontSize(9);
        doc.text(`Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')}`, 14, 21);

        const tableColumn = ["No", "Project Number", "Nama Project", "Wilayah", `EFS (${m1})`, `EFS (${m2})`, "Selisih EFS", `Real (${m1})`, `Real (${m2})`, "Selisih Real"];
        const tableRows = varianceData.map((row, index) => [
          index + 1,
          row.projectNumber || '-',
          row.namaProject || '-',
          row.wilayah || '-',
          formatCompactIDR(row.efs1),
          formatCompactIDR(row.efs2),
          formatCompactIDR(row.diffEfs),
          formatCompactIDR(row.real1),
          formatCompactIDR(row.real2),
          formatCompactIDR(row.diffReal)
        ]);

        doc.autoTable({
          head: [tableColumn],
          body: tableRows,
          startY: 25,
          styles: { fontSize: 8, cellPadding: 2 },
          headStyles: { fillColor: [0, 102, 102], textColor: 255, fontStyle: 'bold' },
          alternateRowStyles: { fillColor: [245, 247, 250] }
        });

        doc.save(`Report_Historical_Variance_${m1}_vs_${m2}.pdf`);
      };

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
            <div className="flex items-center justify-between border-b pb-3 border-slate-100">
              <div>
                <h4 className="font-extrabold text-slate-800 text-sm flex items-center space-x-2">
                  <i data-lucide="line-chart" className="w-4 h-4 text-bni-teal"></i>
                  <span>Tren Historical Alokasi EFS vs Realisasi Kumulatif Bulanan</span>
                </h4>
                <p className="text-xs text-slate-400">Monitoring pergerakan dinamis alokasi anggaran investasi dan tingkat penyerapan kumulatif per bulan</p>
              </div>
              <span className="text-[10px] font-bold text-bni-teal bg-bni-teal-subtle px-2.5 py-1 rounded-full">Jan - Des 2026</span>
            </div>

            <div className="h-72 w-full relative">
              <canvas ref={canvasHistRef}></canvas>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm flex flex-col overflow-hidden max-h-[650px]">
            <div className="p-5 border-b border-slate-100 flex flex-wrap items-center justify-between gap-4 bg-slate-50/50">
              <div>
                <h4 className="font-extrabold text-slate-800 text-sm flex items-center space-x-2">
                  <i data-lucide="git-compare" className="w-4 h-4 text-bni-orange"></i>
                  <span>Perbandingan & Rincian Perubahan Alokasi EFS Per Bulan</span>
                </h4>
                <p className="text-xs text-slate-400">Lakukan komparasi pergerakan alokasi & realisasi proyek antar dua bulan pilihan</p>
              </div>

              <div className="flex items-center space-x-3 bg-white p-1.5 rounded-xl border border-slate-200 shadow-sm">
                <div className="flex items-center space-x-1.5">
                  <span className="text-xs font-bold text-slate-500 pl-1">Bulan A:</span>
                  <select 
                    value={m1} 
                    onChange={e => setM1(e.target.value)}
                    className="bg-slate-100 font-bold text-xs text-slate-700 py-1 px-2 rounded-lg border-none focus:outline-none cursor-pointer"
                  >
                    {MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
                  </select>
                </div>

                <i data-lucide="arrow-right" className="w-4 h-4 text-slate-400"></i>

                <div className="flex items-center space-x-1.5">
                  <span className="text-xs font-bold text-slate-500">Bulan B:</span>
                  <select 
                    value={m2} 
                    onChange={e => setM2(e.target.value)}
                    className="bg-slate-100 font-bold text-xs text-slate-700 py-1 px-2 rounded-lg border-none focus:outline-none cursor-pointer"
                  >
                    {MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
                  </select>
                </div>
              </div>
            </div>

            <div className="p-5 grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-100/40 border-b border-slate-100">
              <div className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
                <span className="text-[10px] font-bold text-slate-400 uppercase block">Total Alokasi EFS ({m1} vs {m2})</span>
                <div className="flex items-baseline space-x-2 mt-1">
                  <span className="text-lg font-black text-slate-800">{formatCompactIDR(varianceStats.totEfs2)}</span>
                  <span className={`text-xs font-extrabold ${varianceStats.diffEfs >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                    ({varianceStats.diffEfs >= 0 ? '+' : ''}{formatCompactIDR(varianceStats.diffEfs)})
                  </span>
                </div>
                <span className="text-[10px] text-slate-400 block mt-0.5">Semula {m1}: {formatCompactIDR(varianceStats.totEfs1)}</span>
              </div>

              <div className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
                <span className="text-[10px] font-bold text-slate-400 uppercase block">Total Realisasi Kumulatif ({m1} vs {m2})</span>
                <div className="flex items-baseline space-x-2 mt-1">
                  <span className="text-lg font-black text-bni-orange">{formatCompactIDR(varianceStats.totReal2)}</span>
                  <span className={`text-xs font-extrabold ${varianceStats.diffReal >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                    ({varianceStats.diffReal >= 0 ? '+' : ''}{formatCompactIDR(varianceStats.diffReal)})
                  </span>
                </div>
                <span className="text-[10px] text-slate-400 block mt-0.5">Semula {m1}: {formatCompactIDR(varianceStats.totReal1)}</span>
              </div>

              <div className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <span className="text-[10px] font-bold text-slate-400 uppercase block">Proyek Mengalami Penyesuaian</span>
                <div className="flex items-center justify-between mt-1">
                  <span className="text-xl font-black text-bni-teal">{varianceStats.changedCount} Project</span>
                  <span className="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">Revisi EFS</span>
                </div>
                <span className="text-[10px] text-slate-400 block">EFS {m1} vs {m2}</span>
              </div>
            </div>

            <div className="p-3 bg-white border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
              <div className="relative min-w-[220px]">
                <i data-lucide="search" className="w-3.5 h-3.5 text-slate-400 absolute left-3 top-2.5"></i>
                <input 
                  type="text" 
                  placeholder="Cari Proyek / Wilayah..." 
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full pl-8 pr-3 py-1 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium focus:outline-none focus:border-bni-teal"
                />
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <span className="text-xs font-bold text-slate-400 mr-1">Filter Perubahan:</span>
                <button 
                  onClick={() => setDynamicDiffFilter('ALL')}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${diffFilter === 'ALL' ? 'bg-bni-teal text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  Semua
                </button>
                <button 
                  onClick={() => setDynamicDiffFilter('CHANGED')}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${diffFilter === 'CHANGED' ? 'bg-bni-orange text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  Berubah
                </button>
                <button 
                  onClick={() => setDynamicDiffFilter('INCREASED')}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${diffFilter === 'INCREASED' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  Naik
                </button>
                <button 
                  onClick={() => setDynamicDiffFilter('DECREASED')}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${diffFilter === 'DECREASED' ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  Turun
                </button>

                <div className="h-4 w-[1px] bg-slate-200 mx-1"></div>

                <button 
                  onClick={exportHistToExcel}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center space-x-1 shadow-sm"
                  title="Export Data ke Excel"
                >
                  <i data-lucide="file-spreadsheet" className="w-3.5 h-3.5"></i>
                  <span>Excel</span>
                </button>

                <button 
                  onClick={exportHistToPDF}
                  className="bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center space-x-1 shadow-sm"
                  title="Export Data ke PDF"
                >
                  <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                  <span>PDF</span>
                </button>
              </div>
            </div>

            <div className="overflow-x-auto overflow-y-auto custom-scrollbar flex-1">
              <table className="w-full text-left text-xs text-slate-600">
                <thead className="bg-slate-50 text-slate-500 font-extrabold uppercase text-[9px] tracking-wider border-b border-slate-200 sticky top-0 z-10 select-none shadow-sm">
                  <tr>
                    <th className="py-2.5 px-2 text-center w-10">No</th>
                    <th onClick={() => handleHistSort('namaProject')} className="py-2.5 px-3 cursor-pointer hover:bg-slate-100 transition-colors">
                      <div className="flex items-center space-x-1">
                        <span>Project Number & Nama Project</span>
                        {renderHistSortIcon('namaProject')}
                      </div>
                    </th>
                    <th onClick={() => handleHistSort('wilayah')} className="py-2.5 px-3 cursor-pointer hover:bg-slate-100 transition-colors">
                      <div className="flex items-center space-x-1">
                        <span>Wilayah / Unit</span>
                        {renderHistSortIcon('wilayah')}
                      </div>
                    </th>
                    <th onClick={() => handleHistSort('efs1')} className="py-2.5 px-3 text-right cursor-pointer hover:bg-slate-100 transition-colors">
                      <div className="flex items-center justify-end space-x-1">
                        <span>Alokasi EFS ({m1})</span>
                        {renderHistSortIcon('efs1')}
                      </div>
                    </th>
                    <th onClick={() => handleHistSort('efs2')} className="py-2.5 px-3 text-right cursor-pointer hover:bg-slate-100 transition-colors">
                      <div className="flex items-center justify-end space-x-1">
                        <span>Alokasi EFS ({m2})</span>
                        {renderHistSortIcon('efs2')}
                      </div>
                    </th>
                    <th onClick={() => handleHistSort('diffEfs')} className="py-2.5 px-3 text-right bg-amber-50/80 cursor-pointer hover:bg-amber-100 transition-colors">
                      <div className="flex items-center justify-end space-x-1">
                        <span>Selisih EFS</span>
                        {renderHistSortIcon('diffEfs')}
                      </div>
                    </th>
                    <th onClick={() => handleHistSort('real1')} className="py-2.5 px-3 text-right cursor-pointer hover:bg-slate-100 transition-colors">
                      <div className="flex items-center justify-end space-x-1">
                        <span>Realisasi Kum. ({m1})</span>
                        {renderHistSortIcon('real1')}
                      </div>
                    </th>
                    <th onClick={() => handleHistSort('real2')} className="py-2.5 px-3 text-right cursor-pointer hover:bg-slate-100 transition-colors">
                      <div className="flex items-center justify-end space-x-1">
                        <span>Realisasi Kum. ({m2})</span>
                        {renderHistSortIcon('real2')}
                      </div>
                    </th>
                    <th onClick={() => handleHistSort('diffReal')} className="py-2.5 px-3 text-right bg-orange-50/80 cursor-pointer hover:bg-orange-100 transition-colors">
                      <div className="flex items-center justify-end space-x-1">
                        <span>Selisih Realisasi</span>
                        {renderHistSortIcon('diffReal')}
                      </div>
                    </th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {varianceData.length === 0 ? (
                    <tr>
                      <td colSpan="9" className="py-8 text-center text-slate-400">
                        Tidak ada data rincian proyek sesuai filter perbandingan.
                      </td>
                    </tr>
                  ) : (
                    varianceData.map((row, idx) => (
                      <tr key={idx} className="hover:bg-slate-50/80 transition-colors">
                        <td className="py-2 px-2 text-center font-bold text-slate-400 text-[10px]">{idx + 1}</td>
                        <td className="py-2 px-3 max-w-[220px]">
                          <div className="flex flex-col space-y-0.5">
                            {row.projectNumber && (
                              <span className="text-[9px] font-extrabold text-bni-teal bg-teal-50 px-1 py-0.2 rounded border border-teal-200/50 w-max">
                                {row.projectNumber}
                              </span>
                            )}
                            <span className="font-bold text-slate-800 truncate" title={row.namaProject}>{row.namaProject || '-'}</span>
                          </div>
                        </td>

                        <td className="py-2 px-3 max-w-[160px]">
                          <div className="flex flex-col space-y-0.5">
                            <span className="text-[9px] font-black uppercase text-indigo-700 bg-indigo-50 px-1 py-0.2 rounded w-max">{row.wilayah}</span>
                            <span className="text-slate-600 truncate text-[10px]">{row.operatingUnit}</span>
                          </div>
                        </td>

                        <td className="py-2 px-3 text-right font-medium text-slate-700">{formatSlimIDR(row.efs1)}</td>
                        <td className="py-2 px-3 text-right font-semibold text-blue-700">{formatSlimIDR(row.efs2)}</td>
                        
                        <td className="py-2 px-3 text-right font-black bg-amber-50/30">
                          {row.diffEfs === 0 ? (
                            <span className="text-slate-300">-</span>
                          ) : (
                            <span className={`px-1.5 py-0.5 rounded text-[10px] ${row.diffEfs > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                              {row.diffEfs > 0 ? '+' : ''}{formatSlimIDR(row.diffEfs)}
                            </span>
                          )}
                        </td>

                        <td className="py-2 px-3 text-right font-medium text-slate-700">{formatSlimIDR(row.real1)}</td>
                        <td className="py-2 px-3 text-right font-semibold text-bni-orange">{formatSlimIDR(row.real2)}</td>

                        <td className="py-2 px-3 text-right font-black bg-orange-50/30">
                          {row.diffReal === 0 ? (
                            <span className="text-slate-300">-</span>
                          ) : (
                            <span className={`px-1.5 py-0.5 rounded text-[10px] ${row.diffReal > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                              {row.diffReal > 0 ? '+' : ''}{formatSlimIDR(row.diffReal)}
                            </span>
                          )}
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [rawData, setRawData] = useState([]);
      const [detailNonOtomasiData, setDetailNonOtomasiData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      
      const [selectedGroup, setSelectedGroup] = useState('ALL');
      const [selectedWilayah, setSelectedWilayah] = useState('ALL');
      const [selectedUnit, setSelectedUnit] = useState('ALL');

      const [reportMonth, setReportMonth] = useState('Jul');

      const [tableSearchTerm, setTableSearchTerm] = useState('');
      const [tableWilayahFilter, setTableWilayahFilter] = useState('ALL');
      const [tableKategoriFilter, setTableKategoriFilter] = useState('ALL');
      const [tableStatusProjFilter, setTableStatusProjFilter] = useState('ALL');
      const [tableStatusEnpFilter, setTableStatusEnpFilter] = useState('ALL');
      const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });

      const [topSearchTerm, setTopSearchTerm] = useState('');
      const [bottomSearchTerm, setBottomSearchTerm] = useState('');
      
      const [activeTab, setActiveTab] = useState('overview'); 
      const [projectsMenuOpen, setProjectsMenuOpen] = useState(true);

      const [selectedProjectForModal, setSelectedProjectForModal] = useState(null);
      const [realisasiInputs, setRealisasiInputs] = useState({});

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      useEffect(() => {
        loadData();
      }, []);

      useEffect(() => {
        const timer = setTimeout(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, 120);
        return () => clearTimeout(timer);
      }, [activeTab, currentPage, loading, selectedProjectForModal]);

      useEffect(() => {
        setCurrentPage(1);
      }, [selectedGroup, selectedWilayah, selectedUnit, activeTab, itemsPerPage, tableSearchTerm, tableWilayahFilter, tableKategoriFilter, tableStatusProjFilter, tableStatusEnpFilter, sortConfig]);

      const loadData = () => {
        setLoading(true);
        const handleSuccess = (res) => {
          const parsed = typeof res === 'string' ? JSON.parse(res) : res;
          if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
            setRawData(parsed.overview || []);
            setDetailNonOtomasiData(parsed.detailNonOtomasi || []);
          } else {

        }));

          setSaving(false);
          let response = res;
          if (typeof res === 'string') {
            try { response = JSON.parse(res); } catch(e) {}
          }
          
          if (response && response.success) {
            alert(response.message || "Realisasi berhasil disimpan!");
            
            const updateState = (dataArr) => dataArr.map(item => {
              if (item.rowId === rowId) {
                return { ...item, ...parsedInputs };

              return item;

            setRawData(prev => updateState(prev));
            setDetailNonOtomasiData(prev => updateState(prev));

            alert("Gagal menyimpan: " + (response ? response.message : "Error terjadi."));
          }

          google.script.run

              alert("Gagal terhubung ke Server: " + err.message);

              action: 'saveData',
              rowId: rowId,
              monthlyInputs: parsedInputs
            })

      const activeSourceData = useMemo(() => {

      const stats = useMemo(() => {

        let totalAktif = 0;

        const targetMonthIdx = MONTHS.indexOf(reportMonth);

          }

          sumAlokasiRevisiRbb,

          for (let i = 0; i <= targetMonthIdx; i++) {

          if (w) {

          summary[c] = { alokasi: 0, realisasi: 0, totalProject: 0, aktif: 0, nonAktif: 0 };
        });

        rawData.forEach(row => {

          else if (cat.includes('perabotan') || cat.includes('non otomasi') || cat.includes('non-otomasi') || cat.includes('mebel')) matchedCat = "Perabotan Non Otomasi";
          else if (cat.includes('kendaraan') || cat.includes('mobil') || cat.includes('motor')) matchedCat = "Kendaraan";

            summary[matchedCat].alokasi += pagu;

              summary[matchedCat].nonAktif += 1;

            const matchName = (row.namaProject || '').toLowerCase().includes(term);
            const matchNum = (row.projectNumber || '').toLowerCase().includes(term);
            if (!matchName && !matchNum) return false;
          }

          if (tableWilayahFilter !== 'ALL') {
            if ((row.wilayah || '') !== tableWilayahFilter) return false;
          }

          if (tableKategoriFilter !== 'ALL') {
            let cat = (row.kategori || '').toLowerCase();
            if (tableKategoriFilter === 'Bangunan Gedung' && !cat.includes('bangunan')) return false;
            if (tableKategoriFilter === 'Tanah' && !cat.includes('tanah')) return false;
            if (tableKategoriFilter === 'Perabotan Otomasi' && (!cat.includes('otomasi') || cat.includes('non'))) return false;
            if (tableKategoriFilter === 'Perabotan Non Otomasi' && !cat.includes('non')) return false;
            if (tableKategoriFilter === 'Kendaraan' && !cat.includes('kendaraan')) return false;
          }

          if (tableStatusProjFilter !== 'ALL') {
            const stProj = (row.statusProject || '').toUpperCase();
            if (tableStatusProjFilter === 'AKTIF' && (stProj === 'NON AKTIF' || stProj === 'DROPPED')) return false;
            if (tableStatusProjFilter === 'NON_AKTIF' && (stProj !== 'NON AKTIF' && stProj !== 'DROPPED')) return false;

          return true;

        if (sortConfig.key !== null) {

              aVal = a.aloEfs;
              bVal = b.aloEfs;

              bVal = b.pctRealisasi;
            } else {
              aVal = a[sortConfig.key];
              bVal = b[sortConfig.key];

            if (bVal === undefined || bVal === null) bVal = '';

            if (typeof aVal === 'string') aVal = aVal.toLowerCase();
            if (typeof bVal === 'string') bVal = bVal.toLowerCase();

            </div>
          </main>

          {selectedProjectForModal && (() => {
            const isNonAktif = String(selectedProjectForModal.statusProject || '').toUpperCase() === 'NON AKTIF' || String(selectedProjectForModal.statusProject || '').toUpperCase() === 'DROPPED';
            const isPenyesuaianEnp = String(selectedProjectForModal.statusEnp || '').toUpperCase() === 'PENYESUAIAN';

            return (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
                <div className="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden transition-all transform scale-100">
                  
                  <div className="bg-bni-teal text-white px-6 py-4 flex items-center justify-between shrink-0">
                    <div className="flex items-center space-x-2.5">
                      <div className="p-2 bg-white/10 rounded-xl">
                        <i data-lucide="layers" className="w-5 h-5 text-amber-300"></i>
                      </div>
                      <div>
                        <h3 className="font-extrabold text-base">Detail & Management Project</h3>
                        <p className="text-[11px] text-teal-100 font-medium">Input Realisasi Otomatis Terhubung ke Database</p>
                      </div>
                    </div>
                    <button 
                      onClick={() => setSelectedProjectForModal(null)}
                      className="p-1 rounded-lg text-teal-100 hover:bg-white/10 hover:text-white transition-all"
                    >
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  <div className="p-6 overflow-y-auto space-y-6 custom-scrollbar text-xs">
                    
                    <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200/80 space-y-4">
                      <div className="flex items-center justify-between border-b pb-2 border-slate-200">
                        <h4 className="font-extrabold text-slate-800 text-sm flex items-center space-x-2">
                          <i data-lucide="info" className="w-4 h-4 text-bni-teal"></i>
                          <span>1. Informasi Project</span>
                        </h4>
                        <span className="text-[10px] font-semibold text-slate-400 bg-white px-2 py-0.5 rounded-full border border-slate-200">Total Alokasi</span>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        <div>
                          <span className="text-slate-400 font-bold block text-[10px] uppercase">a. Wilayah</span>
                          <p className="font-extrabold text-slate-800 text-xs mt-0.5">{selectedProjectForModal.wilayah || '-'}</p>
                        </div>

                        <div>
                          <span className="text-slate-400 font-bold block text-[10px] uppercase">b. Entitas</span>
                          <p className="font-extrabold text-slate-800 text-xs mt-0.5">{selectedProjectForModal.entitas || '-'}</p>
                        </div>

                        <div>
                          <span className="text-slate-400 font-bold block text-[10px] uppercase">c. Operating Unit</span>
                          <p className="font-extrabold text-slate-800 text-xs mt-0.5">{selectedProjectForModal.operatingUnit || '-'}</p>
                        </div>

                        <div>
                          <span className="text-slate-400 font-bold block text-[10px] uppercase">d. Mata Anggaran</span>
                          <p className="font-extrabold text-slate-800 text-xs mt-0.5">{selectedProjectForModal.kategori || '-'}</p>
                        </div>

                        <div>
                          <span className="text-slate-400 font-bold block text-[10px] uppercase">e. Project Number</span>
                          <p className="font-black text-bni-teal text-xs mt-0.5">{selectedProjectForModal.projectNumber || '-'}</p>
                        </div>

                        <div className="sm:col-span-2 md:col-span-3">
                          <span className="text-slate-400 font-bold block text-[10px] uppercase">f. Nama Project</span>
                          <p className="font-bold text-slate-800 text-xs mt-0.5">{selectedProjectForModal.namaProject || '-'}</p>
                        </div>

                        <div>
                          <span className="text-slate-400 font-bold block text-[10px] uppercase">g. Status ENP</span>
                          <span className={`inline-block font-bold text-[10px] px-2 py-0.5 rounded mt-1 ${
                            isPenyesuaianEnp ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-700'
                          }`}>
                            {selectedProjectForModal.statusEnp || 'OK'}
                          </span>
                        </div>

                        <div>
                          <span className="text-slate-400 font-bold block text-[10px] uppercase">h. Status Project</span>
                          <span className={`inline-block font-bold text-[10px] px-2 py-0.5 rounded mt-1 ${
                            isNonAktif ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'
                          }`}>
                            {selectedProjectForModal.statusProject || 'AKTIF'}
                          </span>
                        </div>

                        <div>
                          <span className="text-slate-400 font-bold block text-[10px] uppercase">i. ENP Awal (Rp)</span>
                          <p className="font-extrabold text-slate-700 text-xs mt-0.5">{formatIDR(selectedProjectForModal.enpAwal)}</p>
                        </div>

                        <div>
                          <span className="text-slate-400 font-bold block text-[10px] uppercase">j. Usul Perubahan ENP (Rp)</span>
                          <p className="font-extrabold text-amber-700 text-xs mt-0.5">
                            {selectedProjectForModal.usulPerubahanEnp !== null ? formatIDR(selectedProjectForModal.usulPerubahanEnp) : '-'}
                          </p>
                        </div>

                        <div className="border-t pt-2 border-slate-200 sm:col-span-2 md:col-span-3 lg:col-span-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
                          <div>
                            <span className="text-slate-400 font-bold block text-[10px] uppercase">k. Usul Alokasi Awal</span>
                            <p className="font-black text-bni-teal text-xs mt-0.5">{formatIDR(selectedProjectForModal.alokasiAwal)}</p>
                          </div>
                          <div>
                            <span className="text-slate-400 font-bold block text-[10px] uppercase">l. Usul Alokasi Revisi RBB</span>
                            <p className="font-black text-amber-700 text-xs mt-0.5">{formatIDR(selectedProjectForModal.alokasiRevisiRbb)}</p>
                          </div>
                          <div>
                            <span className="text-slate-400 font-bold block text-[10px] uppercase">m. Alokasi EFS</span>
                            <p className="font-black text-blue-700 text-xs mt-0.5">{formatIDR(selectedProjectForModal.aloEfs || selectedProjectForModal.alokasiEfs)}</p>
                          </div>
                        </div>
                      </div>

                      {isNonAktif && (
                        <div className="bg-rose-50 border border-rose-200 p-3.5 rounded-xl space-y-1">
                          <div className="flex items-center space-x-1.5 text-rose-700 font-extrabold text-xs">
                            <i data-lucide="alert-triangle" className="w-4 h-4"></i>
                            <span>Catatan Pembatalan / Non Aktif (Sheet REJECTED_PROJECT Kolom I):</span>
                          </div>
                          <p className="text-slate-700 font-semibold text-xs leading-relaxed pl-5">
                            {selectedProjectForModal.catatanPembatalan || "Project tidak disetujui / dibatalkan."}
                          </p>
                        </div>
                      )}

                      {isPenyesuaianEnp && (
                        <div className="bg-amber-50 border border-amber-200 p-3.5 rounded-xl flex items-center justify-between flex-wrap gap-2">
                          <div className="flex items-center space-x-2 text-amber-800 font-bold text-xs">
                            <i data-lucide="file-text" className="w-4 h-4 text-bni-orange"></i>
                            <span>Status Penyesuaian ENP Disertai Berkas Dokumen:</span>
                          </div>
                          {selectedProjectForModal.linkDokumenEnp ? (
                            <a 
                              href={selectedProjectForModal.linkDokumenEnp} 
                              target="_blank" 
                              rel="noopener noreferrer"
                              className="bg-bni-orange hover:bg-bni-orange-dark text-white px-3 py-1 rounded-lg text-xs font-bold transition-all flex items-center space-x-1 shadow-sm"
                            >
                              <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                              <span>Lihat Berkas Dokumen ENP (Kolom K)</span>
                            </a>
                          ) : (
                            <span className="text-slate-400 italic font-medium text-xs">Berkas Dokumen ENP Belum Diunggah</span>
                          )}
                        </div>
                      )}

                    </div>

                    <div className="bg-amber-50/40 p-5 rounded-2xl border border-amber-200/60 space-y-3">
                      <div className="flex items-center justify-between border-b pb-2 border-amber-200/50">
                        <h4 className="font-extrabold text-slate-800 text-sm flex items-center space-x-2">
                          <i data-lucide="edit-3" className="w-4 h-4 text-bni-orange"></i>
                          <span>2. Input Realisasi Bulanan (Jan - Des)</span>
                        </h4>
                        <span className="text-[10px] font-semibold text-amber-800">Tersimpan ke Sheet INPUT_REALISASI_USER</span>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                        {MONTHS.map((m) => {
                          const key = m.toLowerCase();
                          return (
                            <div key={m} className="space-y-1">
                              <label className="text-[10px] font-bold text-slate-500 uppercase flex items-center justify-between">
                                <span>Realisasi {m}</span>
                                <span className="text-slate-400 font-normal">Rp</span>
                              </label>
                              <input 
                                type="text" 
                                value={realisasiInputs[key] || ''} 
                                onChange={(e) => handleRealisasiInputChange(key, e.target.value)}
                                placeholder="0"
                                className="w-full px-3 py-1.5 bg-white border border-slate-300 rounded-xl font-bold text-slate-800 text-xs focus:outline-none focus:border-bni-teal text-right"
                              />
                            </div>
                          );
                        })}
                      </div>
                    </div>

                  </div>

                  <div className="bg-slate-50 px-6 py-3.5 border-t border-slate-100 flex items-center justify-end space-x-2 shrink-0">
                    <button 
                      onClick={() => setSelectedProjectForModal(null)}
                      className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-xs transition-all"
                    >
                      Batal
                    </button>
                    <button 
                      onClick={handleSaveRealisasi}
                      disabled={saving}
                      className="bg-bni-orange hover:bg-bni-orange-dark text-white font-bold px-5 py-2 rounded-xl text-xs transition-all shadow-sm flex items-center space-x-1.5 disabled:opacity-50"
                    >
                      {saving ? (
                        <>
                          <i data-lucide="loader-2" className="w-3.5 h-3.5 animate-spin"></i>
                          <span>Menyimpan...</span>
                        </>
                      ) : (
                        <>
                          <i data-lucide="save" className="w-3.5 h-3.5"></i>
                          <span>Simpan Realisasi</span>
                        </>
                      )}
                    </button>
                  </div>

                </div>
              </div>
            );
          })()}

          <footer className="fixed bottom-0 left-0 right-0 z-40 bg-slate-900 text-white shadow-2xl border-t border-slate-800 text-xs flex flex-col md:flex-row items-center justify-between overflow-hidden">
            <div className="flex-1 w-full overflow-hidden relative py-2.5 px-4 bg-slate-950 flex items-center">
              <div className="bg-bni-orange text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider mr-3 shrink-0 z-10 shadow-sm flex items-center space-x-1">
                <i data-lucide="activity" className="w-3 h-3"></i>
                <span>Summary Highlights</span>
              </div>

              <div className="overflow-hidden w-full relative">
                <div className="animate-marquee whitespace-nowrap flex items-center space-x-8 text-xs font-medium">
                  {(() => {
                    const renderTickerContent = () => (
                      <>
                        <div className="flex items-center space-x-2 bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg">
                          <span className="text-slate-400 text-[10px] uppercase font-bold">Total Alokasi EFS ({tickerStats.currentMonthName}):</span>
                          <span className="font-extrabold text-blue-400 text-xs">{formatCompactIDR(tickerStats.totalAlokasiEfs)}</span>
                        </div>

                        <div className="flex items-center space-x-2 bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg">
                          <span className="text-slate-400 text-[10px] uppercase font-bold">Realisasi ({tickerStats.currentMonthName}):</span>
                          <span className="font-extrabold text-amber-400 text-xs">{formatCompactIDR(tickerStats.totalKumulatifBulanBerjalan)}</span>
                        </div>

                        <div className="flex items-center space-x-2 bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg">
                          <span className="text-slate-400 text-[10px] uppercase font-bold">% Realisasi Total ({tickerStats.currentMonthName}):</span>
                          <span className="font-extrabold text-emerald-400 text-xs">{tickerStats.pctRealisasiTotal}%</span>
                        </div>

                        <span className="text-slate-700 font-black">|</span>

                        <div className="flex items-center space-x-3">
                          <span className="font-extrabold text-bni-orange uppercase tracking-wider text-[11px] flex items-center space-x-1">
                            <span>📍 Realisasi Per Wilayah ({tickerStats.currentMonthName}):</span>
                          </span>
                          {tickerStats.listWilayahPct.map((item, idx) => (
                            <span key={`wil-${idx}`} className="inline-flex items-center space-x-1.5 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg">
                              <span className="font-bold text-slate-300 text-[11px]">{item.wilayah}:</span>
                              <span className={`font-black text-[11px] ${
                                item.pct >= 85 ? 'text-emerald-400' :
                                item.pct >= 50 ? 'text-amber-400' : 'text-rose-400'
                              }`}>
                                {item.pct.toFixed(2)}%
                              </span>
                            </span>
                          ))}
                        </div>

                        <span className="text-slate-700 font-black">|</span>

                        <div className="flex items-center space-x-3">
                          <span className="font-extrabold text-emerald-400 uppercase tracking-wider text-[11px] flex items-center space-x-1">
                            <span>🔥 Top 10 High Performance ({tickerStats.currentMonthName}):</span>
                          </span>
                          {top10ProjectsList.map((proj, idx) => (
                            <span key={`top-tick-${idx}`} className="inline-flex items-center space-x-1.5 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg">
                              <span className="text-slate-400 font-bold text-[10px]">#{idx + 1}</span>
                              <span className="font-bold text-slate-200 max-w-[130px] truncate" title={proj.namaProject}>
                                [{proj.projectNumber || 'PROJ'}] {proj.namaProject}
                              </span>
                              <span className="text-emerald-400 font-black text-[11px] bg-emerald-950 px-1.5 py-0.5 rounded border border-emerald-800/50">
                                {proj.pctRealisasi.toFixed(2)}%
                              </span>
                            </span>
                          ))}
                        </div>

                        <span className="text-slate-700 font-black">|</span>

                        <div className="flex items-center space-x-3">
                          <span className="font-extrabold text-rose-400 uppercase tracking-wider text-[11px] flex items-center space-x-1">
                            <span>⚠️ Bottom 10 Need Attention ({tickerStats.currentMonthName}):</span>
                          </span>
                          {bottom10ProjectsList.map((proj, idx) => (
                            <span key={`bot-tick-${idx}`} className="inline-flex items-center space-x-1.5 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg">
                              <span className="text-slate-400 font-bold text-[10px]">#{idx + 1}</span>
                              <span className="font-bold text-slate-200 max-w-[130px] truncate" title={proj.namaProject}>
                                [{proj.projectNumber || 'PROJ'}] {proj.namaProject}
                              </span>
                              <span className="text-rose-400 font-black text-[11px] bg-rose-950 px-1.5 py-0.5 rounded border border-rose-800/50">
                                {proj.pctRealisasi.toFixed(2)}%
                              </span>
                              <span className="text-[10px] text-slate-500 font-mono">
                                ({formatCompactIDR(proj.aloEfs)})
                              </span>
                            </span>
                          ))}
                        </div>

                        <span className="text-slate-700 font-black">|</span>
                      </>
                    );

                    return (
                      <>
                        {renderTickerContent()}
                        {renderTickerContent()}
                      </>
                    );
                  })()}
                </div>
              </div>
            </div>

            <div className="bg-slate-900 px-4 py-2 border-t md:border-t-0 md:border-l border-slate-800 shrink-0 text-slate-400 text-[11px] font-medium text-center">
              Copyright © 2026 by <b className="text-slate-200 font-extrabold">Fajar Ramadhan[cite: 1] - P052099</b> | Divisi NSD
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
