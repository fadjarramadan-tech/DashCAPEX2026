          if (tableSearchTerm) {
            const term = tableSearchTerm.toLowerCase();
            const matchName = (row.namaProject || '').toLowerCase().includes(term);
            const matchNum = (row.projectNumber || '').toLowerCase().includes(term);
            if (!matchName && !matchNum) return false;
          }

          if (tableWilayahFilter !== 'ALL') {
            if ((row.wilayah || '') !== tableWilayahFilter) return false;
          }

          if (tableKategoriFilter !== 'ALL') {
            let cat = (row.kategori || '').toLowerCase();
            if (tableKategoriFilter === 'Bangunan Gedung' && !cat.includes('bangunan')) return false;
            if (tableKategoriFilter === 'Tanah' && !cat.includes('tanah')) return false;
            if (tableKategoriFilter === 'Perabotan Otomasi' && (!cat.includes('otomasi') || cat.includes('non'))) return false;
            if (tableKategoriFilter === 'Perabotan Non Otomasi' && !cat.includes('non')) return false;
            if (tableKategoriFilter === 'Kendaraan' && !cat.includes('kendaraan')) return false;
          }

          // -- FILTER KATEGORI PROJECT MULTI-PILIHAN --
          if (tableKatProjectFilter.length > 0) {
            const rowKat = String(row.kategoriProject || '').trim();
            if (!tableKatProjectFilter.includes(rowKat)) return false;
          }

          // -- FILTER STATUS EFS MULTI-PILIHAN --
          if (tableStatusEfsFilter.length > 0) {
            const rowStEfs = String(row.statusEfs || 'Active').trim();
            if (!tableStatusEfsFilter.includes(rowStEfs)) return false;
          }

          if (tableStatusProjFilter !== 'ALL') {
            const stProj = (row.statusProject || '').toUpperCase();
            if (tableStatusProjFilter === 'AKTIF' && (stProj === 'NON AKTIF' || stProj === 'DROPPED')) return false;
            if (tableStatusProjFilter === 'NON_AKTIF' && (stProj !== 'NON AKTIF' && stProj !== 'DROPPED')) return false;
          }

          if (tableStatusEnpFilter !== 'ALL') {
            if ((row.statusEnp || '').toUpperCase() !== tableStatusEnpFilter.toUpperCase()) return false;
          }

          return true;
        });

        if (sortConfig.key !== null) {
          data.sort((a, b) => {
            let aVal, bVal;

            if (sortConfig.key === 'realisasi') {
              aVal = Number(a.totalReal) || 0;
              bVal = Number(b.totalReal) || 0;
            } else if (sortConfig.key === 'alokasiEfs') {
              aVal = Number(a.aloEfs) || 0;
              bVal = Number(b.aloEfs) || 0;
            } else if (sortConfig.key === 'pctRealisasi') {
              aVal = Number(a.pctRealisasi) || 0;
              bVal = Number(b.pctRealisasi) || 0;
            } else if (sortConfig.key === 'enpAwal') {
              aVal = Number(a.enpAwal) || 0;
              bVal = Number(b.enpAwal) || 0;
            } else if (sortConfig.key === 'alokasiAwal') {
              aVal = Number(a.alokasiAwal) || 0;
              bVal = Number(b.alokasiAwal) || 0;
            } else if (sortConfig.key === 'alokasiRevisiRbb') {
              aVal = Number(a.alokasiRevisiRbb) || 0;
              bVal = Number(b.alokasiRevisiRbb) || 0;
            } else if (sortConfig.key === 'qty') {
              aVal = Number(a.qty) || 0;
              bVal = Number(b.qty) || 0;
            } else {
              aVal = a[sortConfig.key];
              bVal = b[sortConfig.key];
            }

            if (aVal === undefined || aVal === null) aVal = '';
            if (bVal === undefined || bVal === null) bVal = '';

            if (typeof aVal === 'string') aVal = aVal.toLowerCase();
            if (typeof bVal === 'string') bVal = bVal.toLowerCase();

            if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
            if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }

        return data;
      }, [mappedProjectsData, tableSearchTerm, tableWilayahFilter, tableKategoriFilter, tableStatusProjFilter, tableStatusEnpFilter, tableKatProjectFilter, tableStatusEfsFilter, sortConfig]);

      const resetTableFilters = () => {
        setTableSearchTerm('');
        setTableWilayahFilter('ALL');
        setTableKategoriFilter('ALL');
        setTableStatusProjFilter('ALL');
        setTableStatusEnpFilter('ALL');
        setTableKatProjectFilter([]);
        setTableStatusEfsFilter([]);
        setSortConfig({ key: null, direction: 'asc' });
      };

      const exportProjectsToExcel = () => {
        const rows = tableRows.map((row, index) => {
          const base = {
            "No": index + 1,
            "Project Number": row.projectNumber || '-',
            "Nama Project": row.namaProject || '-',
            "Kategori": row.kategori || '-',
            "Wilayah": row.wilayah || '-',
            "Operating Unit": row.operatingUnit || '-'
          };

          if (activeTab === 'Perabotan Non Otomasi') {
            base["Qty"] = row.qty || 0;
          }

          return {
            ...base,
            "ENP Awal": row.enpAwal || 0,
            "Alokasi Awal": row.alokasiAwal || 0,
            "Revisi RBB": row.alokasiRevisiRbb || 0,
            [`Alokasi EFS (${reportMonth})`]: row.aloEfs || 0,
            [`Realisasi Kumulatif (${reportMonth})`]: row.totalReal || 0,
            "% Realisasi": row.pctRealisasi ? Number(row.pctRealisasi.toFixed(2)) : 0,
            "Status": row.statusProject || 'AKTIF'
          };
        });

        const worksheet = XLSX.utils.json_to_sheet(rows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Data_Projects");
        XLSX.writeFile(workbook, `Report_Projects_${activeTab}_${reportMonth}.xlsx`);
      };

      const exportProjectsToPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');

        doc.setFontSize(14);
        doc.text(`Laporan Daftar Proyek - ${activeTab} (${reportMonth})`, 14, 15);
        doc.setFontSize(9);
        doc.text(`Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')}`, 14, 21);

        const tableColumn = ["No", "Project Number", "Nama Project", "Wilayah", "Alokasi Awal", `EFS (${reportMonth})`, `Realisasi Kum. (${reportMonth})`, "% Real", "Status"];
        const tableDataRows = tableRows.map((row, index) => [
          index + 1,
          row.projectNumber || '-',
          row.namaProject || '-',
          row.wilayah || '-',
          formatCompactIDR(row.alokasiAwal),
          formatCompactIDR(row.aloEfs),
          formatCompactIDR(row.totalReal),
          `${(row.pctRealisasi || 0).toFixed(1)}%`,
          row.statusProject || 'AKTIF'
        ]);

        doc.autoTable({
          head: [tableColumn],
          body: tableDataRows,
          startY: 25,
          styles: { fontSize: 8, cellPadding: 2 },
          headStyles: { fillColor: [0, 102, 102], textColor: 255, fontStyle: 'bold' },
          alternateRowStyles: { fillColor: [245, 247, 250] }
        });

        doc.save(`Report_Projects_${activeTab}_${reportMonth}.pdf`);
      };

      const totalPages = Math.max(1, Math.ceil(tableRows.length / itemsPerPage));
      
      const currentTableData = useMemo(() => {
        const startIdx = (currentPage - 1) * itemsPerPage;
        return tableRows.slice(startIdx, startIdx + itemsPerPage);
      }, [tableRows, currentPage, itemsPerPage]);

      const pageNumbers = useMemo(() => {
        const pages = [];
        if (totalPages <= 7) {
          for (let i = 1; i <= totalPages; i++) pages.push(i);
        } else {
          if (currentPage <= 4) {
            pages.push(1, 2, 3, 4, 5, '...', totalPages);
          } else if (currentPage >= totalPages - 3) {
            pages.push(1, '...', totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages);
          } else {
            pages.push(1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages);
          }
        }
        return pages;
      }, [currentPage, totalPages]);

      const totalColumns = activeTab === 'Perabotan Non Otomasi' ? 12 : 11;

      const renderSortIcon = (columnKey) => {
        if (sortConfig.key !== columnKey) {
          return <span className="ml-1 text-slate-300 hover:text-slate-500">↕</span>;
        }
        return sortConfig.direction === 'asc' 
          ? <span className="ml-1 text-bni-teal font-extrabold">▲</span> 
          : <span className="ml-1 text-bni-teal font-extrabold">▼</span>;

      return (
        <div className="min-h-screen flex bg-[#F3F5F9] relative pb-16">
          <aside className="w-64 bg-white border-r border-slate-200/80 flex flex-col justify-between p-5 hidden lg:flex shrink-0">
            <div>
              <div className="flex items-center space-x-3 px-2 mb-8">
                <div className="bg-bni-orange text-white font-black px-2.5 py-1 rounded-lg text-lg tracking-wider shadow-sm">
                  BNI
                </div>
                <div>
                  <h1 className="font-bold text-slate-800 text-sm leading-none">PM-CAPEX</h1>
                  <span className="text-[10px] text-slate-400 font-medium">CAPEX Analytics 2026</span>
                </div>
              </div>

              <div className="space-y-6">

                  <p className="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">General</p>

                    >

                      >
